    notesEs: "- Linux: el runtime de Java ahora se descomprime correctamente (el inicio fallaba con \"invalid Zip archive\")\n- Linux: el enlace de inicio de sesión de Microsoft por código abre el navegador con más fiabilidad\n- Linux: interfaz más fluida (desenfoque y transiciones desactivados)\n- Las insignias en el juego muestran la nuez de NUTclient, Admin es morado"
