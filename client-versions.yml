notesEs: "- Nuevo logo: la nuez de NUTclient sustituye a la «N» en los menús (pequeña arriba a la izquierda, grande al fondo abajo a la derecha).\n- Armario y tienda: las categorías son una lista a la izquierda (como en los clientes modernos) con la cuadrícula de tarjetas al lado. La barra de pestañas tiene un resaltado naranja y el logo.\n- Corrección de la tienda: ahora solo muestra lo que aún puedes comprar. Antes mostraba capas gratuitas y de la comunidad con «0 monedas».\n- Menú hub (Mayús derecha): mosaicos redondeados.\n- Nuevo módulo «Trucos de rendimiento» (Rendimiento, activado por defecto): no dibuja los armor stands marcadores invisibles, los animales pasivos más allá de una distancia configurable (28 bloques por defecto) ni los marcos o cuadros que miran hacia atrás de la cámara. Cada opción se puede desactivar por separado. El efecto en los FPS no se ha medido.\n- La lista del armario/tienda, el logo y el hub están completos en las versiones 26.x. En 1.21.8 a 1.21.11 el logo es nuevo, la nueva vista del armario y la tienda aún falta."
notesFr: "- Nouveau logo : la noix NUTclient remplace le « N » dans les menus (petite en haut à gauche, grande en arrière-plan en bas à droite).\n- Casier et boutique : les catégories sont une liste à gauche (comme dans les clients modernes), avec la grille de cartes à côté. La barre d'onglets a une surbrillance orange et le logo.\n- Correction de la boutique : elle n'affiche plus que ce que vous pouvez encore acheter. Avant, elle listait des capes gratuites et communautaires à « 0 pièce ».\n- Menu hub (Maj droite) : tuiles arrondies.\n- Nouveau module « Astuces de performance » (Performance, activé par défaut) : ne dessine pas les marqueurs invisibles (armor stands), les animaux passifs au-delà d'une distance réglable (28 blocs par défaut) et les cadres ou tableaux tournés vers l'arrière de la caméra. Chaque option peut être désactivée séparément. L'effet sur les FPS n'a pas été mesuré.\n- La liste du casier/boutique, le logo et le hub sont complets dans les versions 26.x. En 1.21.8 à 1.21.11, le logo est nouveau, la nouvelle vue du casier et de la boutique manque encore."
betaNotesEs: "- New title screen: logo and name in the center, buttons for Singleplayer, Multiplayer, Friends and Locker & Shop, an icon bar at the top right, an expandable community banner and a switch between Custom and Vanilla.\n- Selectable menu background (panorama or our own animated one) and buttons in the NUTclient style in all menus (setting in the “Custom menus” module).\n- Pause menu: icon bar and “Switch server” – the server list inside a world; joining leaves the old server first.\n- Notifications: “Copy” and “Open” buttons after an upload, notifications disappear after a configurable time, half the size by default, screenshot notifications can be turned off.\n- The “N” on the title screen is now our nut."
betaNotesFr: "- New title screen: logo and name in the center, buttons for Singleplayer, Multiplayer, Friends and Locker & Shop, an icon bar at the top right, an expandable community banner and a switch between Custom and Vanilla.\n- Selectable menu background (panorama or our own animated one) and buttons in the NUTclient style in all menus (setting in the “Custom menus” module).\n- Pause menu: icon bar and “Switch server” – the server list inside a world; joining leaves the old server first.\n- Notifications: “Copy” and “Open” buttons after an upload, notifications disappear after a configurable time, half the size by default, screenshot notifications can be turned off.\n- The “N” on the title screen is now our nut."
