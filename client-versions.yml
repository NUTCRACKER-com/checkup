jarUrl: "https://github.com/NUTCRACKER-com/checkup/releases/download/client-v0.5.62/nutclient-0.5.62.jar"
notesEn: "- New logo: the NUTclient nut replaces the \"N\" in the menus (small top left, large in the background bottom right).\n- Locker and shop: categories are a list on the left (like modern clients) with the card grid next to it. The tab bar has an orange highlight and the logo.\n- Shop fix: the shop now only shows things you can still buy. Before, it listed free and community capes with \"0 coins\".\n- Hub menu (Right Shift): rounded tiles.\n- New module \"Performance tricks\" (Performance, on by default): skips drawing invisible marker armor stands, passive animals beyond a configurable distance (default 28 blocks), and item frames or paintings that face away from the camera. Each option can be turned off separately. The effect on FPS has not been measured.\n- Locker/shop list, logo and hub are complete in the 26.x versions. In 1.21.8 to 1.21.11 the logo is new, the new locker and shop view is still missing."
latest: "0.5.62"
releasesRepo: "NUTCRACKER-com/checkup"
notes: "- Neues Logo: Die NUTclient-Nuss ersetzt das „N“ in den Menüs (oben links klein, unten rechts groß im Hintergrund).\n- Schrank und Shop: Die Kategorien stehen als Liste links (wie bei modernen Clients), das Karten-Raster daneben. Die Tab-Leiste hat eine orange Markierung und das Logo.\n- Shop-Fix: Der Shop zeigt nur noch Kaufbares, das du noch nicht besitzt. Vorher standen dort Gratis- und Community-Capes mit „0 Coins“.\n- Hub-Menü (Rechts-Shift): abgerundete Kacheln.\n- Neues Modul „Leistungs-Tricks“ (Leistung, standardmäßig an): zeichnet unsichtbare Marker-Armorstands, passive Tiere ab einer einstellbaren Entfernung (Standard 28 Blöcke) und Item-Rahmen oder Bilder mit dem Rücken zur Kamera gar nicht erst. Jede Option lässt sich einzeln abschalten. Die Wirkung auf die FPS ist nicht gemessen.\n- Schrank/Shop-Liste, Logo und Hub sind in den Versionen 26.x vollständig, in 1.21.8 bis 1.21.11 ist das Logo neu, die neue Schrank- und Shop-Ansicht fehlt dort noch."

