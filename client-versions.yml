  - version: "0.5.61"
    date: "2026-11-02"
    notes: "- Neues Modul-Menü: Module sind jetzt Karten mit Icon, Name und einem grünen AN- oder roten AUS-Balken, Zahnrad oben rechts für die Optionen (alle Versionen).\n- Schrank und Shop: abgerundete Karten und Chips. HUD-Editor: neuer Knopf „Alle Einstellungen …“ im Rechtsklick-Menü, „HUD-Layout bearbeiten“ ist ein Hauptknopf (26.x).\n- Community-Capes (freigegebene Einreichungen) kann jeder ohne Kaufen oder Freischalten ausrüsten.\n- Item-Physik: neue Fall-Physik. Items drehen sich im Fall schneller und kippen nach dem Aufprall gedämpft in die flache Lage.\n- Namensschilder: Hat ein Server eigene Schilder, hängt NUTclient Rollen-Icon und Zusatztext daran, statt ein zweites zu zeichnen. Ohne eigene Server-Schilder bleibt unser Schild wie gewohnt.\n- Neue Nuss-Regeln: eine Nuss pro Spieler in der Rollenfarbe, ohne Rolle weiß, und eine Nuss mit rotem Kreuz für Spieler, die NUTclient schon benutzt haben, aber gerade nicht. In der Tab-Liste gelten dieselben Farben.\n- Der Standardtext „NUTclient“ wird nicht mehr an fremde Namensschilder gehängt."
    notesEn: "- New module menu: modules are cards with icon, name and a green ON or red OFF bar, with a gear in the top right for options (all versions).\n- Locker and shop: rounded cards and chips. HUD editor: new \"All settings …\" button in the right-click menu, and \"Edit HUD layout\" is now a main button (26.x).\n- Community capes (approved submissions) can be equipped by anyone without buying or unlocking them.\n- Item physics: new fall physics. Items spin faster the faster they fall and settle into the flat position with a damped wobble after landing.\n- Name tags: if a server has its own tags, NUTclient attaches the role icon and extra text to them instead of drawing a second tag. Without server tags, ours stays as before.\n- New nut rules: one nut per player in the role colour, white without a role, and a nut with a red cross for players who have used NUTclient before but are not using it right now. The tab list uses the same colours.\n- The default text \"NUTclient\" is no longer attached to other players' name tags."
    notesFr: "- Nouveau menu des modules : les modules sont des cartes avec icône, nom et une barre verte ON ou rouge OFF, avec un engrenage en haut à droite pour les options (toutes les versions).\n- Casier et boutique : cartes et puces arrondies. Éditeur de HUD : nouveau bouton « Tous les réglages … » dans le menu du clic droit, et « Modifier la disposition du HUD » est un bouton principal (26.x).\n- Les capes de la communauté (propositions approuvées) peuvent être équipées par tout le monde sans achat ni déblocage.\n- Physique des objets : nouvelle physique de chute. Les objets tournent plus vite quand ils tombent plus vite et se posent à plat avec un balancement amorti après l'atterrissage.\n- Plaques de nom : si un serveur a ses propres plaques, NUTclient y ajoute l'icône de rôle et le texte supplémentaire au lieu d'en dessiner une deuxième. Sans plaques du serveur, la nôtre reste comme avant.\n- Nouvelles règles pour la noix : une noix par joueur dans la couleur du rôle, blanche sans rôle, et une noix avec une croix rouge pour les joueurs qui ont déjà utilisé NUTclient mais ne l'utilisent pas en ce moment. La liste des joueurs utilise les mêmes couleurs.\n- Le texte par défaut « NUTclient » n'est plus ajouté aux plaques de nom des autres joueurs."
    notesEs: "- Nuevo menú de módulos: los módulos son tarjetas con icono, nombre y una barra verde ON o roja OFF, con un engranaje arriba a la derecha para las opciones (todas las versiones).\n- Armario y tienda: tarjetas y chips redondeados. Editor de HUD: nuevo botón «Todos los ajustes …» en el menú del clic derecho, y «Editar diseño del HUD» es ahora un botón principal (26.x).\n- Las capas de la comunidad (propuestas aprobadas) las puede equipar cualquiera sin comprarlas ni desbloquearlas.\n- Física de objetos: nueva física de caída. Los objetos giran más rápido cuanto más rápido caen y se asientan en posición plana con un balanceo amortiguado tras aterrizar.\n- Placas de nombre: si un servidor tiene sus propias placas, NUTclient les añade el icono de rol y el texto adicional en lugar de dibujar una segunda. Sin placas del servidor, la nuestra sigue como antes.\n- Nuevas reglas de la nuez: una nuez por jugador con el color del rol, blanca sin rol, y una nuez con una cruz roja para jugadores que ya usaron NUTclient pero ahora no lo usan. La lista de jugadores usa los mismos colores.\n- El texto predeterminado «NUTclient» ya no se añade a las placas de nombre de otros jugadores."
  - version: "0.5.60"
    date: "2026-11-01"
    notes: "- Namensschilder: Hat ein Server ein eigenes Namensschild (Team-Präfix, Text-Display oder Namens-Passagier), zeigt NUTclient sein eigenes nicht mehr. Rollen-Icon und Zusatztext werden stattdessen an das Schild des Servers angehängt.\n- Namensschilder: Das Rollen-Icon steht in der Namenszeile statt in der oberen Zusatzzeile. Pro Spieler gibt es nur noch eine Nuss: in der Rollenfarbe, ohne Rolle in Weiß.\n- Das Nuss-Icon ist hochauflösend (256 px statt 32 px) und in der Nahansicht deutlich schärfer.\n- Minecraft 1.21.9: läuft wieder mit Fabric API 0.133.14.\n- Linux: Der Build läuft wieder durch (AppImage und .deb)."
    notesEn: "- Name tags: if a server has its own name tag (team prefix, text display or name passenger), NUTclient no longer draws its own. Role icon and extra text are added to the server's tag instead.\n- Name tags: the role icon sits in the name line instead of the upper extra line. Each player now has a single nut: in the role colour, white without a role.\n- The nut icon is high resolution (256 px instead of 32 px) and much sharper up close.\n- Minecraft 1.21.9: works again with Fabric API 0.133.14.\n- Linux: the build works again (AppImage and .deb)."
    notesFr: "- Plaques de nom : si un serveur a sa propre plaque (préfixe d'équipe, text display ou passager de nom), NUTclient ne dessine plus la sienne. L'icône de rôle et le texte supplémentaire sont ajoutés à la plaque du serveur.\n- Plaques de nom : l'icône de rôle se trouve dans la ligne du nom et non dans la ligne supplémentaire du haut. Chaque joueur n'a plus qu'une seule noix : couleur du rôle, blanche sans rôle.\n- L'icône de la noix est en haute résolution (256 px au lieu de 32 px) et nettement plus nette de près.\n- Minecraft 1.21.9 : fonctionne de nouveau avec Fabric API 0.133.14.\n- Linux : la compilation fonctionne de nouveau (AppImage et .deb)."
    notesEs: "- Placas de nombre: si un servidor tiene su propia placa (prefijo de equipo, text display o pasajero de nombre), NUTclient ya no dibuja la suya. El icono de rol y el texto adicional se añaden a la placa del servidor.\n- Placas de nombre: el icono de rol está en la línea del nombre y no en la línea adicional superior. Cada jugador tiene ahora una sola nuez: del color del rol, blanca sin rol.\n- El icono de la nuez es de alta resolución (256 px en lugar de 32 px) y mucho más nítido de cerca.\n- Minecraft 1.21.9: vuelve a funcionar con Fabric API 0.133.14.\n- Linux: la compilación vuelve a funcionar (AppImage y .deb)."
  - version: "0.5.59"
    date: "2026-11-01"
    notes: "- Freecam: Der eigene Spieler wird jetzt in der Freecam gezeichnet (Körper, Skin, Rüstung). Die Hitbox-Anzeige zeigt keine Box mehr um die Kamera.\n- Freecam: „Bei Schaden ausschalten“ ist ein eigener Schalter im Freecam-Modul (standardmäßig aus).\n- Launcher: neue Einstellung „Beim Anmelden in Windows starten“ (standardmäßig aus).\n- Übersetzungen: erster Batch für Englisch, Französisch und Spanisch.\n- Creator-Programm, Teammarkierungen, Xaero-Waypoints aus dem Chat und das neue Menü-Design sind in dieser Version enthalten."
    notesEn: "- Freecam: your own player is now drawn in freecam (body, skin, armor). The hitbox display no longer draws a box around the camera.\n- Freecam: \"Disable on damage\" is its own switch in the freecam module (off by default).\n- Launcher: new setting \"Start when Windows starts\" (off by default).\n- Translations: first batch for English, French and Spanish.\n- Creator program, team markers, Xaero waypoints from chat and the new menu design are included in this version."
    notesFr: "- Caméra libre : votre propre joueur est maintenant affiché en caméra libre (corps, skin, armure). L'affichage des hitbox ne dessine plus de cadre autour de la caméra.\n- Caméra libre : « Désactiver en cas de dégâts » est un interrupteur propre au module (désactivé par défaut).\n- Lanceur : nouveau réglage « Démarrer avec Windows » (désactivé par défaut).\n- Traductions : premier lot pour l'anglais, le français et l'espagnol.\n- Le programme Créateur, les marqueurs d'équipe, les waypoints Xaero depuis le chat et le nouveau design de menu sont inclus dans cette version."
    notesEs: "- Cámara libre: ahora tu propio jugador se dibuja en la cámara libre (cuerpo, skin, armadura). La visualización de hitboxes ya no dibuja un recuadro alrededor de la cámara.\n- Cámara libre: «Desactivar al recibir daño» es un interruptor propio del módulo (desactivado por defecto).\n- Lanzador: nuevo ajuste «Iniciar al arrancar Windows» (desactivado por defecto).\n- Traducciones: primer lote para inglés, francés y español.\n- El programa de creadores, las marcas de equipo, los waypoints de Xaero desde el chat y el nuevo diseño de menú están incluidos en esta versión."
  - version: "0.5.58"
    date: "2026-10-31"
    notes: "- Linux: Der Update-Knopf öffnet jetzt die neue Version zum Herunterladen (vorher passierte nichts)\n- Die NUTclient-Nuss ersetzt den grünen Rhombus vor den Namen von NUTclient-Spielern (grün online, grau offline)\n- Die Rang-Zeile über dem Namen entfällt, wenn kein eigener Text gesetzt ist"
    notesEn: "- Linux: the update button now opens the new version for download (before, nothing happened)\n- The NUTclient nut replaces the green diamond before the names of NUTclient players (green online, grey offline)\n- The rank line above the name is gone when there is no custom text"
    notesFr: "- Linux : le bouton de mise à jour ouvre maintenant la nouvelle version au téléchargement (avant, rien ne se passait)\n- La noix NUTclient remplace le losange vert devant les noms des joueurs NUTclient (vert en ligne, gris hors ligne)\n- La ligne de rang au-dessus du nom disparaît quand aucun texte personnalisé n'est défini"
    notesEs: "- Linux: el botón de actualización ahora abre la nueva versión para descargarla (antes no pasaba nada)\n- La nuez de NUTclient reemplaza el rombo verde delante de los nombres de los jugadores de NUTclient (verde en línea, gris sin conexión)\n- La línea de rango sobre el nombre desaparece cuando no hay texto propio"
  - version: "0.5.57"
    date: "2026-10-31"
    notes: "- Linux: Java-Laufzeit wird jetzt richtig entpackt (Start schlug mit „invalid Zip archive“ fehl)\n- Linux: Anmeldung über den Microsoft-Code-Link öffnet den Browser zuverlässiger\n- Linux: Oberfläche ist flüssiger (Unschärfe und Übergänge aus)\n- Abzeichen im Spiel zeigt die NUTclient-Nuss, Admin ist lila"
    notesEn: "- Linux: the Java runtime is now extracted correctly (start failed with \"invalid Zip archive\")\n- Linux: the Microsoft code sign-in link opens the browser more reliably\n- Linux: smoother interface (blur and transitions off)\n- In-game badges show the NUTclient nut, admin is purple"
