  - version: "0.5.51"
    date: "2026-10-31"
    notes: "- Logo oben links zeigt jetzt die NUTclient-Nuss\n- Neues Launcher-Icon: die NUTclient-Nuss (App, Startbild, Einrichtung)"
    notesEn: "- The logo in the top left now shows the NUTclient nut\n- New launcher icon: the NUTclient nut (app, splash screen, setup)"
    notesFr: "- Le logo en haut a gauche affiche maintenant la noix NUTclient\n- Nouvelle icone du lanceur : la noix NUTclient (appli, ecran de demarrage, installation)"
