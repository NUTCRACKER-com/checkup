  - version: "0.5.27"
    date: "2026-10-22"
    notes: "- Neu: Serverordner (Server aufeinander ziehen) und Resourcepack-Ordner (auch echte Unterordner in resourcepacks/) jetzt auch in 26.2, 26.1.x, 1.21.9–1.21.11 (zuvor nur 26.3)"
    notesEn: "- New: server folders (drag servers onto each other) and resource pack folders (including real subfolders in resourcepacks/) now also in 26.2, 26.1.x, 1.21.9–1.21.11 (previously 26.3 only)"
    notesFr: "- Nouveau : dossiers de serveurs (glisser les serveurs l'un sur l'autre) et dossiers de packs de ressources (y compris de vrais sous-dossiers de resourcepacks/) aussi dans 26.2, 26.1.x, 1.21.9–1.21.11 (auparavant 26.3 uniquement)"
    notesEs: "- Nuevo: carpetas de servidores (arrastra servidores uno sobre otro) y carpetas de packs de recursos (incluidas subcarpetas reales de resourcepacks/) ahora también en 26.2, 26.1.x, 1.21.9–1.21.11 (antes solo 26.3)"
  - version: "0.5.26"
    date: "2026-10-20"
    notes: "- Behoben: Tiers fragt bei einem Ausfall von pvptiers.com nicht mehr für jeden Spieler einzeln an (2 Minuten Pause, einmaliger Hinweis, danach automatisch wieder)"
    notesEn: "- Fixed: Tiers no longer queries every player separately when pvptiers.com is down (2-minute pause, one notice, then automatic retry)"
    notesFr: "- Corrigé : Tiers n'interroge plus chaque joueur séparément quand pvptiers.com est en panne (pause de 2 minutes, un seul avis, puis nouvelle tentative automatique)"
    notesEs: "- Corregido: Tiers ya no consulta a cada jugador por separado cuando pvptiers.com está caído (pausa de 2 minutos, un aviso y reintento automático)"
  - version: "0.5.25"
    date: "2026-10-20"
    notes: "- Behoben: FPS-Einbruch bei allen Instanzen – das eigene Java-Speicher-Tuning (aggressive G1-Werte) ist entfernt, Minecraft startet wieder mit den normalen Java-Standardwerten\n- Verbessert: Der Hänger-Wächter belastet das Spiel weniger"
    notesEn: "- Fixed: FPS drop on all instances – the custom Java memory tuning (aggressive G1 values) is removed, Minecraft starts with normal Java defaults again\n- Improved: the stall watchdog puts less load on the game"
    notesFr: "- Corrigé : chute de FPS sur toutes les instances – le réglage mémoire Java personnalisé (valeurs G1 agressives) est supprimé, Minecraft démarre de nouveau avec les valeurs Java par défaut\n- Amélioré : le détecteur de saccades charge moins le jeu"
    notesEs: "- Corregido: caída de FPS en todas las instancias – se elimina el ajuste de memoria de Java personalizado (valores G1 agresivos), Minecraft arranca de nuevo con los valores predeterminados de Java\n- Mejorado: el vigilante de tirones carga menos el juego"
  - version: "0.5.24"
    date: "2026-10-20"
    notes: "- Behoben: FPS-Einbruch – Modul-Prüfungen (Server-Regeln, WorldEdit-Erkennung) liefen bei jedem Bild hundertfach und durchsuchten dabei Befehlsbäume; jetzt zwischengespeichert\n- Behoben: „Konto: …“-Knopf erschien mehrfach untereinander"
    notesEn: "- Fixed: FPS drop – module checks (server rules, WorldEdit detection) ran hundreds of times per frame and scanned command trees; now cached\n- Fixed: the \"Account: …\" button appeared several times stacked"
    notesFr: "- Corrigé : chute de FPS – les vérifications de modules (règles de serveur, détection de WorldEdit) s'exécutaient des centaines de fois par image et parcouraient les arbres de commandes ; désormais mises en cache\n- Corrigé : le bouton « Compte : … » apparaissait plusieurs fois empilé"
    notesEs: "- Corregido: caída de FPS – las comprobaciones de módulos (reglas de servidor, detección de WorldEdit) se ejecutaban cientos de veces por fotograma y recorrían árboles de comandos; ahora se guardan en caché\n- Corregido: el botón «Cuenta: …» aparecía varias veces apilado"
  - version: "0.5.23"
    date: "2026-10-20"
    notes: "- Neu: Server-Ordner in der Serverliste (Server aufeinander ziehen, Klick klappt auf/zu, Doppelklick öffnet, Entf löst auf) – nur Minecraft 26.3\n- Neu: Resourcepack-Ordner – Unterordner von resourcepacks/ werden erkannt, Packs per Ziehen in Ordner legen – nur Minecraft 26.3\n- Neu: Screenshots posten und hochladen ohne Imgur-Konto (direkt zum NUTclient-Server, 4 MB, 25 pro Tag)\n- Neu: Creator-Dashboard im Launcher (Unterstützer, Downloads, Installationen mit deinem Code)\n- Verbessert: Ping zeigt jetzt die echte Zeit bis zum Server (Ping-Paket wie F3) statt der Zeit bis zum Proxy\n- Verbessert: Dynamic FPS entfernt – keine kurze 2-FPS-Phase mehr nach Alt-Tab\n- Verbessert: Health Indicator sitzt fest über dem Namensschild, läuft geschmeidig und ist auch durch Wände sichtbar\n- Verbessert: Launcher – Musik-Karte unter der oberen Leiste (überdeckt nichts mehr), Hauptknöpfe mit Farbverlauf, Buttons überlappen sich nicht mehr"
    notesEn: "- New: server folders in the server list (drag servers onto each other, click to expand/collapse, double-click to open, Del to dissolve) – Minecraft 26.3 only\n- New: resource pack folders – subfolders of resourcepacks/ are recognised, drag packs into folders – Minecraft 26.3 only\n- New: post and upload screenshots without an Imgur account (straight to the NUTclient server, 4 MB, 25 per day)\n- New: creator dashboard in the launcher (supporters, downloads, installs with your code)\n- Improved: ping now shows the real time to the server (ping packet like F3) instead of the time to the proxy\n- Improved: Dynamic FPS removed – no more short 2 FPS phase after alt-tab\n- Improved: Health Indicator sits firmly above the name tag, animates smoothly and is visible through walls\n- Improved: launcher – music card below the top bar (covers nothing any more), gradient primary buttons, buttons no longer overlap"
    notesFr: "- Nouveau : dossiers de serveurs dans la liste (glisser les serveurs l'un sur l'autre, clic pour déplier/replier, double-clic pour ouvrir, Suppr pour dissoudre) – Minecraft 26.3 uniquement\n- Nouveau : dossiers de packs de ressources – les sous-dossiers de resourcepacks/ sont reconnus, glisser les packs dans des dossiers – Minecraft 26.3 uniquement\n- Nouveau : publier et téléverser des captures d'écran sans compte Imgur (directement vers le serveur NUTclient, 4 Mo, 25 par jour)\n- Nouveau : tableau de bord créateur dans le launcher (soutiens, téléchargements, installations avec ton code)\n- Amélioré : le ping affiche désormais le vrai temps jusqu'au serveur (paquet de ping comme F3) et non jusqu'au proxy\n- Amélioré : Dynamic FPS supprimé – plus de courte phase à 2 FPS après un Alt-Tab\n- Amélioré : l'Health Indicator reste fixé au-dessus du pseudo, s'anime en douceur et est visible à travers les murs\n- Amélioré : launcher – carte musique sous la barre du haut (ne cache plus rien), boutons principaux en dégradé, boutons qui ne se chevauchent plus"
    notesEs: "- Nuevo: carpetas de servidores en la lista (arrastra servidores uno sobre otro, clic para abrir/cerrar, doble clic para entrar, Supr para disolver) – solo Minecraft 26.3\n- Nuevo: carpetas de packs de recursos – se reconocen las subcarpetas de resourcepacks/, arrastra packs a carpetas – solo Minecraft 26.3\n- Nuevo: publicar y subir capturas sin cuenta de Imgur (directo al servidor de NUTclient, 4 MB, 25 al día)\n- Nuevo: panel de creador en el launcher (seguidores, descargas, instalaciones con tu código)\n- Mejorado: el ping muestra ahora el tiempo real hasta el servidor (paquete de ping como F3) y no hasta el proxy\n- Mejorado: se elimina Dynamic FPS – sin la breve fase de 2 FPS tras el Alt-Tab\n- Mejorado: el Health Indicator queda fijo sobre el nombre, se anima con suavidad y se ve a través de las paredes\n- Mejorado: launcher – tarjeta de música bajo la barra superior (ya no tapa nada), botones principales con degradado, los botones ya no se superponen"
  - version: "0.5.22"
    date: "2026-10-19"
    notes: "- Neu: Launcher im neuen Design „NUT Navy“ – Seitenleiste mit Text, obere Leiste (News, Accounts, Logo, Glocke, Clips, Instanzen-Overview), Startseite mit Spieler-Feld und „Spielen“; neue Menüs „News“ (alle Changelogs) und „Instanzen-Overview“ (Live-Logs aller laufenden Instanzen)\n- Neu: Alle Menüs im Spiel im gleichen Stil (dunkelblau mit hellblauem Akzent)\n- Neu: Modul „Health Indicator“ (Herzen, Leiste, Zahl oder Leiste + Zahl über dem Kopf) – das Leben ist dafür aus den Namensschildern raus\n- Neu: HUD-Modul „Spieler-Modell“ – du selbst als 3D-Modell im HUD, 1:1 wie du aussiehst, sehr viele Einstellungen\n- Neu: Follow-System – folgen, zurückfolgen = befreundet; Nachrichten von Nicht-Freunden als Anfrage mit Annehmen/Ablehnen; Privatsphäre-Einstellungen; Freunde auf dem Server als Köpfe in der Serverliste\n- Neu: Creator-Kit – mit dem Code eines Creators dessen Server, Packs, Mods und Einstellungen übernehmen; Creator können ihr Kit bearbeiten und geheime Packs hochladen (werden als versteckte Mod geladen)\n- Neu: Capes einreichen (Skin-Menü) – das Team gibt sie im Discord frei; Cosmetics aufgeräumt: nur noch Heiligenschein und Engelsflügel (OG für die erste Beta) und die Emotes\n- Neu: Rollen-Zeichen (Admin, Team, NUT+, Creator, Beta Tester) immer über dem Namen; Benachrichtigungen komplett abschaltbar\n- Neu: Beim ersten Start Zustimmung zu Nutzungsbedingungen und Datenschutzerklärung; danach wird die Installation registriert (Einstellungen → Tracking → Zustimmung widerrufen und Daten löschen)\n- Fix: /nutrules ging manchmal mitten im Kampf auf (Linksklick bei gefangener Maus); Server-Regeln gehen nicht mehr zufällig verloren\n- Fix: Launcher sichert Instanzen und Einstellungen in eine Datei und stellt sie bei leerem Speicher wieder her"
    notesEn: "- New: Launcher in the new “NUT Navy” design – text sidebar, top bar (News, Accounts, logo, bell, Clips, Instance overview), home with player box and “Play”; new menus “News” (all changelogs) and “Instance overview” (live logs of all running instances)\n- New: All in-game menus in the same style (dark blue with a light-blue accent)\n- New: “Health Indicator” module (hearts, bar, number or bar + number above the head) – health is no longer part of the name tags\n- New: “Player Model” HUD module – you as a 3D model in the HUD, 1:1 as you look, with lots of settings\n- New: Follow system – follow, follow back = friends; messages from non-friends as a request you accept or decline; privacy settings; friends on a server shown as heads in the server list\n- New: Creator kit – enter a creator’s code to copy their servers, packs, mods and settings; creators can edit their kit and upload secret packs (loaded as a hidden mod)\n- New: Submit capes (Skin menu) – the team approves them on Discord; cosmetics cleaned up: only the halo and angel wings (OG for the first beta) and the emotes remain\n- New: Role badges (Admin, Team, NUT+, Creator, Beta Tester) always shown above names; notifications can be turned off completely\n- New: At first start you accept the Terms of Use and Privacy Policy; the installation is then registered (Settings → Tracking → Withdraw consent and delete data)\n- Fix: /nutrules sometimes opened in the middle of a fight (left click while the mouse was grabbed); server rules no longer get lost at random\n- Fix: The launcher mirrors instances and settings to a file and restores them if its storage is empty"
    notesFr: "- Nouveau : launcher au nouveau design « NUT Navy » – barre latérale texte, barre supérieure (News, Comptes, logo, cloche, Clips, Aperçu des instances), accueil avec zone joueur et « Jouer » ; nouveaux menus « News » (tous les changelogs) et « Aperçu des instances » (logs en direct de toutes les instances)\n- Nouveau : tous les menus en jeu dans le même style (bleu foncé, accent bleu clair)\n- Nouveau : module « Health Indicator » (cœurs, barre, nombre ou barre + nombre au-dessus de la tête) – la vie n’est plus dans les pseudos\n- Nouveau : module HUD « Modèle du joueur » – toi en modèle 3D dans le HUD, fidèle à ton apparence, très configurable\n- Nouveau : système de suivi – suivre, suivre en retour = amis ; messages de non-amis sous forme de demande à accepter ou refuser ; réglages de confidentialité ; amis présents sur un serveur affichés en têtes dans la liste\n- Nouveau : kit créateur – saisis le code d’un créateur pour copier ses serveurs, packs, mods et réglages ; les créateurs peuvent modifier leur kit et envoyer des packs secrets (chargés comme mod caché)\n- Nouveau : soumettre des capes (menu Skin) – l’équipe les valide sur Discord ; cosmétiques nettoyés : seuls le halo et les ailes d’ange (OG pour la première bêta) et les emotes restent\n- Nouveau : badges de rôle (Admin, Team, NUT+, Créateur, Bêta testeur) toujours affichés au-dessus du nom ; notifications désactivables\n- Nouveau : au premier lancement, acceptation des conditions d’utilisation et de la politique de confidentialité ; l’installation est ensuite enregistrée (Réglages → Suivi → Retirer le consentement et supprimer les données)\n- Correction : /nutrules s’ouvrait parfois en plein combat (clic gauche souris capturée) ; les règles de serveur ne se perdent plus au hasard\n- Correction : le launcher sauvegarde instances et réglages dans un fichier et les restaure si son stockage est vide"
    notesEs: "- Nuevo: launcher con el nuevo diseño «NUT Navy» – barra lateral de texto, barra superior (News, Cuentas, logo, campana, Clips, Resumen de instancias), inicio con el jugador y «Jugar»; nuevos menús «News» (todos los changelogs) y «Resumen de instancias» (logs en vivo de todas las instancias)\n- Nuevo: todos los menús del juego con el mismo estilo (azul oscuro con acento azul claro)\n- Nuevo: módulo «Health Indicator» (corazones, barra, número o barra + número sobre la cabeza) – la vida ya no está en los nombres\n- Nuevo: módulo HUD «Modelo del jugador» – tú como modelo 3D en el HUD, igual que te ves, muy configurable\n- Nuevo: sistema de seguimiento – seguir, seguir de vuelta = amigos; mensajes de no amigos como solicitud que aceptas o rechazas; ajustes de privacidad; amigos en un servidor como cabezas en la lista\n- Nuevo: kit de creador – introduce el código de un creador para copiar sus servidores, packs, mods y ajustes; los creadores pueden editar su kit y subir packs secretos (cargados como mod oculto)\n- Nuevo: enviar capas (menú Skin) – el equipo las aprueba en Discord; cosméticos depurados: solo quedan el halo y las alas de ángel (OG de la primera beta) y los emotes\n- Nuevo: insignias de rol (Admin, Team, NUT+, Creador, Beta tester) siempre sobre el nombre; notificaciones desactivables\n- Nuevo: en el primer inicio se aceptan las condiciones de uso y la política de privacidad; luego se registra la instalación (Ajustes → Seguimiento → Retirar consentimiento y borrar datos)\n- Corrección: /nutrules se abría a veces en pleno combate (clic izquierdo con el ratón capturado); las reglas de servidor ya no se pierden al azar\n- Corrección: el launcher guarda instancias y ajustes en un archivo y los restaura si su almacenamiento está vacío"
  - version: "0.5.21"
    date: "2026-10-18"
    notes: "- Neu: Weniger Lag-Spitzen – Minecraft startet mit Java-Einstellungen für kurze Speicherbereinigungs-Pausen und festem Start-Speicher (wenn du nicht schon eigene Argumente dafür gesetzt hast)\n- Neu: Die Ping-Anzeige zeigt auf Wunsch Netz-Schwankung und PC-Ruckler, so siehst du, ob Lag vom Netzwerk oder vom eigenen PC kommt\n- Neu: Ruckler-Wächter – bei Hängern schreibt der Client in logs/nutclient-stalls.log auf, was das Spiel gerade tat, damit Ruckler gezielt behoben werden können"
    notesEn: "- New: Fewer lag spikes – Minecraft now starts with Java settings for short garbage-collection pauses and a fixed starting heap (unless you already set your own arguments for that)\n- New: The ping display can show network jitter and PC stutters, so you can see whether lag comes from the network or your own PC\n- New: Stutter watchdog – on freezes the client writes what the game was doing to logs/nutclient-stalls.log so stutters can be fixed precisely"
    notesFr: "- Nouveau : moins de pics de lag – Minecraft démarre avec des réglages Java pour de courtes pauses du ramasse-miettes et une mémoire de départ fixe (sauf si tu as déjà tes propres arguments)\n- Nouveau : l’affichage du ping peut montrer la variation réseau et les saccades du PC, pour voir si le lag vient du réseau ou de ton PC\n- Nouveau : surveillance des saccades – lors d’un gel, le client note dans logs/nutclient-stalls.log ce que faisait le jeu, afin de corriger précisément les saccades"
    notesEs: "- Nuevo: menos picos de lag – Minecraft arranca con ajustes de Java para pausas cortas del recolector de basura y memoria inicial fija (salvo que ya tengas tus propios argumentos)\n- Nuevo: el indicador de ping puede mostrar la variación de red y los tirones del PC, para ver si el lag viene de la red o de tu PC\n- Nuevo: vigilante de tirones – en los bloqueos el cliente anota en logs/nutclient-stalls.log lo que hacía el juego, para corregir los tirones con precisión"
  - version: "0.5.20"
    date: "2026-10-17"
    notes: "- Neu: „Changelogs ansehen“ in den Einstellungen und im Update-Fenster – alle Changelogs in allen Sprachen\n- Neu: Profile 2.0 auf allen Versionen – sichern auch Grafik-, Tasten-, Sound-, Chat- und Skin-Einstellungen (je Bereich wählbar), Farbe, Notiz, Umbenennen, Duplizieren, Teilen per Code, Vorschau der Änderungen, automatisch zurück zum vorigen Profil, Knopf im Optionsmenü\n- Neu: Resourcepacks per Link installieren (Modrinth-Seite oder .zip-Link), optional gleich aktivieren und in einen Pack-Ordner legen\n- Neu: Ping wird jetzt echt gemessen statt des oft viel zu hohen Serverwerts\n- Fix: Die Meldung „Module gesperrt“ erscheint nur noch beim Beitritt über die Serverliste, nicht mehr bei Server-Wechseln (z. B. Duelle)\n- Fix: Knöpfe im Resourcepack-Menü überlappen die Listen nicht mehr, der Konto-Knopf passt sich dem Namen an"
    notesEn: "- New: “View changelogs” in Settings and the update window – all changelogs in all languages\n- New: Profiles 2.0 on all versions – now also save graphics, controls, sound, chat and skin settings (selectable per area), color, note, rename, duplicate, share by code, change preview, automatic return to the previous profile, button in the options menu\n- New: Install resource packs by link (Modrinth page or .zip link), optionally activate right away and put into a pack folder\n- New: Ping is now really measured instead of the often far too high server value\n- Fix: The “modules locked” notice now only appears when joining from the server list, not on server transfers (e.g. duels)\n- Fix: Buttons in the resource pack screen no longer overlap the lists, the account button fits the name"
    notesFr: "- Nouveau : « Voir les changelogs » dans les paramètres et la fenêtre de mise à jour – tous les changelogs dans toutes les langues\n- Nouveau : Profils 2.0 sur toutes les versions – enregistrent aussi les réglages graphiques, touches, son, chat et skin (au choix), couleur, note, renommer, dupliquer, partage par code, aperçu des changements, retour automatique au profil précédent, bouton dans le menu d’options\n- Nouveau : installer des packs de ressources par lien (page Modrinth ou lien .zip), activation immédiate possible et rangement dans un dossier\n- Nouveau : le ping est maintenant vraiment mesuré, au lieu de la valeur du serveur souvent bien trop élevée\n- Correction : l’avis « modules bloqués » n’apparaît plus qu’en rejoignant depuis la liste des serveurs, pas lors des changements de serveur (p. ex. duels)\n- Correction : les boutons du menu des packs ne chevauchent plus les listes, le bouton de compte s’adapte au nom"
    notesEs: "- Nuevo: «Ver changelogs» en Ajustes y en la ventana de actualización – todos los changelogs en todos los idiomas\n- Nuevo: Perfiles 2.0 en todas las versiones – guardan también ajustes de gráficos, teclas, sonido, chat y skin (a elegir por área), color, nota, renombrar, duplicar, compartir por código, vista previa de cambios, vuelta automática al perfil anterior, botón en el menú de opciones\n- Nuevo: instalar paquetes de recursos por enlace (página de Modrinth o enlace .zip), con activación inmediata opcional y carpeta de paquetes\n- Nuevo: el ping ahora se mide de verdad en lugar del valor del servidor, a menudo demasiado alto\n- Corrección: el aviso «módulos bloqueados» solo aparece al entrar desde la lista de servidores, no en cambios de servidor (p. ej. duelos)\n- Corrección: los botones del menú de paquetes ya no se superponen a las listas, el botón de cuenta se ajusta al nombre"
  - version: "0.5.19"
    date: "2026-10-17"
    notes: "- Neu: Resourcepack-Ordner & Presets (Knopf im Pack-Menü): eigene Ordner, Packs sperren, Presets sichern, Ordner/Presets schalten sich beim Beitritt zu einem Server automatisch ein\n- Neu: HUD-Editor mit „+“-Knopf, Einstellungen als Seitenleiste mit Live-Vorschau, Split-Chat-Fenster direkt im Editor verschieb- und skalierbar\n- Neu: Profile (Menü → Profile): Einstellungen + Resourcepacks speichern, per Knopf oder automatisch beim Beitritt zu Server/Welt wechseln, Module je Profil erzwingen (ersetzt „Einstellungen sichern“)\n- Neu: Kamera-Tasten (F5-Perspektiven auf Tasten, Halten/Umschalten), NUTclient-Tasten im Vanilla-Tastenmenü\n- Änderung: HUD-Module nicht mehr in der Modulliste; Flugtempo läuft nur noch im Hintergrund (Strg + Mausrad); Eimer-Fix entfernt; Crystal Optimizer standardmäßig aus\n- Neu: Server-Regeln mit Detail-Fenster (alle gesperrten Module im Volltext), pro Server „nicht mehr melden“ oder „ignorieren“ (langes Halten), /nutrules\n- Neu: Benachrichtigungen bleiben bis Klick/Hover, max. 5, liegen über allen Menüs und dem Ladebildschirm\n- Neu: Server-Banner und -Icons in der Serverliste (aus den Server-Mappings: Lunar, NoRisk u. a.)\n- Neu: TNT-Timer, Arrow Trail, Time Changer, Weather Changer\n- Fix: Beitritt scheitert mit „ungültige Chat-Signatur“ (Konto-Prüfung, Schlüssel-Reparatur, Beitritt ohne Schlüssel)\n- Launcher: Support-ID mit „Support-Daten senden“, echtes Mouse Tweaks wird nicht mehr installiert, Log-Fenster/Start-Overlay-Fixes"
    notesEn: "- New: resource pack folders & presets (button in the pack menu): own folders, lock packs, save presets, folders/presets switch on automatically when joining a server\n- New: HUD editor with a \"+\" button, settings as a side panel with live preview, split-chat windows movable/resizable right in the editor\n- New: profiles (menu → Profiles): save settings + resource packs, switch by button or automatically when joining a server/world, force modules per profile (replaces \"back up settings\")\n- New: camera keys (F5 perspectives on keys, hold/toggle), NUTclient keys in the vanilla controls menu\n- Change: HUD modules no longer in the module list; flight speed now runs in the background only (Ctrl + wheel); bucket fix removed; Crystal Optimizer off by default\n- New: server rules with a detail screen (all locked modules in full), per server \"don't notify again\" or \"ignore\" (long press), /nutrules\n- New: notifications stay until clicked/hovered, max 5, drawn above every menu and the loading screen\n- New: server banners and icons in the server list (from the server mappings: Lunar, NoRisk, …)\n- New: TNT Timer, Arrow Trail, Time Changer, Weather Changer\n- Fix: joining fails with \"invalid chat signature\" (account check, key repair, join without key)\n- Launcher: support ID with \"send support data\", the real Mouse Tweaks mod is no longer installed, log window / launch overlay fixes"
    notesFr: "- Nouveau : dossiers et préréglages de packs de ressources (bouton dans le menu des packs) : dossiers, verrouillage, préréglages, activation automatique par serveur\n- Nouveau : éditeur HUD avec bouton « + », réglages en panneau latéral avec aperçu en direct, fenêtres de chat séparé déplaçables/redimensionnables dans l'éditeur\n- Nouveau : profils (menu → Profils) : enregistrer réglages + packs de ressources, changer par bouton ou automatiquement en rejoignant un serveur/monde, forcer des modules par profil\n- Nouveau : touches caméra (perspectives F5 sur des touches), touches NUTclient dans le menu des commandes vanilla\n- Changement : modules HUD hors de la liste ; vitesse de vol en arrière-plan uniquement ; Bucket-Fix retiré ; Crystal Optimizer désactivé par défaut\n- Nouveau : règles du serveur avec écran de détails (tous les modules bloqués en entier), par serveur « ne plus notifier » ou « ignorer » (appui long), /nutrules\n- Nouveau : les notifications restent jusqu'au clic/survol, 5 max, au-dessus de tous les menus et de l'écran de chargement\n- Nouveau : bannières et icônes de serveur dans la liste (depuis les mappings : Lunar, NoRisk, …)\n- Nouveau : TNT Timer, Arrow Trail, Time Changer, Weather Changer\n- Correctif : connexion refusée « signature de chat invalide » (vérification du compte, réparation de la clé, connexion sans clé)\n- Launcher : ID de support avec « envoyer les données », le vrai Mouse Tweaks n'est plus installé, correctifs fenêtre de logs / overlay de lancement"
    notesEs: "- Nuevo: carpetas y ajustes preestablecidos de paquetes de recursos (botón en el menú de paquetes): carpetas, bloqueo, presets, activación automática por servidor\n- Nuevo: editor HUD con botón «+», ajustes en panel lateral con vista previa en vivo, ventanas de chat dividido movibles/redimensionables en el editor\n- Nuevo: perfiles (menú → Perfiles): guardar ajustes + paquetes de recursos, cambiar con botón o automáticamente al entrar a un servidor/mundo, forzar módulos por perfil\n- Nuevo: teclas de cámara (perspectivas F5 en teclas), teclas NUTclient en el menú de controles vanilla\n- Cambio: módulos HUD fuera de la lista; velocidad de vuelo solo en segundo plano; Bucket-Fix eliminado; Crystal Optimizer desactivado por defecto\n- Nuevo: reglas del servidor con pantalla de detalles (todos los módulos bloqueados completos), por servidor «no avisar más» o «ignorar» (pulsación larga), /nutrules\n- Nuevo: las notificaciones permanecen hasta clic/hover, máx. 5, sobre todos los menús y la pantalla de carga\n- Nuevo: banners e iconos de servidor en la lista (de los mappings: Lunar, NoRisk, …)\n- Nuevo: TNT Timer, Arrow Trail, Time Changer, Weather Changer\n- Corrección: fallo al entrar por «firma de chat no válida» (comprobación de cuenta, reparación de clave, entrar sin clave)\n- Launcher: ID de soporte con «enviar datos», ya no se instala el Mouse Tweaks real, arreglos de ventana de logs / overlay de inicio"
