  - version: "0.5.50"
    date: "2026-10-31"
    notes: "- Chest Tracker: eigene Taste (Gegenstand in der Hand suchen), ganze Doppelkiste leuchtet, der Gegenstand in der Kiste leuchtet auch\n- Liedtext ist jetzt ein eigenes Modul (Kategorie Musik) mit 2D- und 3D-Version\n- Fuer jedes Modul laesst sich eine Taste zum An-/Ausschalten festlegen\n- Knopf \"Alle Einstellungen zuruecksetzen\" in jedem Modul\n- Profile zeigen mit * an, wenn sie von den aktuellen Einstellungen abweichen\n- Kurze Einfuehrung beim ersten Start\n- Tipps im HUD-Editor beim Ueberfahren eines Elements\n- Ping wird jetzt jede Sekunde aktualisiert\n- Musik-Anzeige: Zeit und Balken laufen jetzt auf die Millisekunde genau\n- Mehrere Module waren im Menue nicht sichtbar und sind jetzt da\n- Neues Launcher-Icon und Logo: die NUTclient-Nuss (App, Startbild, Einrichtung, Leiste)"
    notesEn: "- Chest Tracker: own key (search for the held item), the whole double chest glows, the item inside glows too\n- Lyrics is now its own module (Music category) with a 2D and a 3D version\n- Every module can get a key to toggle it on/off\n- \"Reset all settings\" button in every module\n- Profiles show a * when they differ from the current settings\n- Short intro on first start\n- Tips in the HUD editor when hovering an element\n- Ping now updates every second\n- Music display: time and bar are now millisecond-accurate\n- Several modules were missing from the menu and are now there\n- New launcher icon and logo: the NUTclient nut (app, splash screen, setup, top bar)"
    notesFr: "- Chest Tracker : touche dediee (chercher l'objet en main), tout le coffre double brille, l'objet dans le coffre aussi\n- Les paroles sont un module a part (categorie Musique) en version 2D et 3D\n- Chaque module peut avoir une touche pour l'activer/desactiver\n- Bouton \"Reinitialiser tous les parametres\" dans chaque module\n- Les profils affichent un * quand ils different des parametres actuels\n- Courte introduction au premier demarrage\n- Astuces dans l'editeur HUD au survol d'un element\n- Le ping se met a jour chaque seconde\n- Affichage musique : temps et barre precis a la milliseconde\n- Plusieurs modules manquaient dans le menu et y sont maintenant\n- Nouvelle icone et logo du lanceur : la noix NUTclient (appli, ecran de demarrage, installation, barre)"
    notesEs: "- Chest Tracker: tecla propia (buscar el objeto en la mano), todo el cofre doble brilla y el objeto dentro tambien\n- La letra es ahora un modulo propio (categoria Musica) con version 2D y 3D\n- Cada modulo puede tener una tecla para activarlo/desactivarlo\n- Boton \"Restablecer todos los ajustes\" en cada modulo\n- Los perfiles muestran un * cuando difieren de los ajustes actuales\n- Breve introduccion en el primer inicio\n- Consejos en el editor HUD al pasar sobre un elemento\n- El ping se actualiza cada segundo\n- Pantalla de musica: tiempo y barra precisos al milisegundo\n- Varios modulos faltaban en el menu y ahora estan\n\n- Nuevo icono y logo del launcher: la nuez de NUTclient (app, pantalla de inicio, configuracion, barra)"
  - version: "0.5.47"
    date: "2026-10-29"
    notes: "- Neu: Behälter-Tracker. Merkt sich beim Öffnen, was in Truhen, Fässern, Shulkerboxen und Ender-Truhen liegt. Die Daten bleiben lokal und überstehen Neustarts. `/nutchest <Gegenstand>` findet Behälter mit dem Gegenstand und markiert sie in der Welt mit Anzahl. Das Modul ist standardmäßig aus.\n- Neu: Liedtext zur laufenden Musik, synchron zur gerade gesungenen Zeile (Quelle: LRCLIB). Braucht die Musik-Anzeige. Das Modul ist standardmäßig aus."
    notesEn: "- New: Container Tracker. Remembers what is inside chests, barrels, shulker boxes and ender chests when you open them. The data stays local and survives restarts. `/nutchest <item>` finds containers holding the item and marks them in the world with the count. The module is off by default.\n- New: Lyrics for the currently playing music, synced to the line being sung (source: LRCLIB). Needs the Now Playing display. The module is off by default."
    notesFr: "- Nouveau : Suivi des conteneurs. Mémorise le contenu des coffres, tonneaux, boîtes de shulker et coffres de l'Ender à l'ouverture. Les données restent en local et survivent aux redémarrages. `/nutchest <objet>` trouve les conteneurs qui contiennent l'objet et les marque dans le monde avec le nombre. Le module est désactivé par défaut.\n- Nouveau : paroles de la musique en cours, synchronisées sur la ligne chantée (source : LRCLIB). Nécessite l'affichage de la musique. Le module est désactivé par défaut."
    notesEs: "- Nuevo: Rastreador de contenedores. Recuerda qué hay dentro de cofres, barriles, cajas shulker y cofres de Ender al abrirlos. Los datos se guardan en local y sobreviven a los reinicios. `/nutchest <objeto>` encuentra los contenedores con ese objeto y los marca en el mundo con la cantidad. El módulo está desactivado por defecto.\n- Nuevo: letra de la música que suena, sincronizada con la línea que se canta (fuente: LRCLIB). Requiere la visualización de música. El módulo está desactivado por defecto."
  - version: "0.5.46"
    date: "2026-10-29"
    notes: "- Hotfix: kleinere Stabilitäts-Korrekturen am Client und Launcher."
    notesEn: "- Hotfix: minor stability fixes in the client and launcher."
    notesFr: "- Correctif : petites corrections de stabilité dans le client et le lanceur."
    notesEs: "- Corrección: pequeñas correcciones de estabilidad en el cliente y el lanzador."
  - version: "0.5.45"
    date: "2026-10-29"
    notes: "- Neu (nur Minecraft 26.3): Server-Hub. Eine Halle mit Portalen zu Servern, sortiert nach Public / Ours / Partner / Your Servers. Aufruf: Rechts-Shift, Kachel 8. Die Hub-Welt wird beim Verlassen wieder gelöscht.\n- Neu (nur Minecraft 26.3): Behälter-Tracker. Merkt sich beim Öffnen, was in Truhen, Fässern, Shulkerboxen und Ender-Truhen liegt. Die Daten bleiben lokal und überstehen Neustarts. `/nutchest <Gegenstand>` findet Behälter mit dem Gegenstand und markiert sie in der Welt mit Anzahl. Das Modul ist standardmäßig aus.\n- Aufgeräumt: doppelte Module sind zusammengelegt (z. B. Totem-Animation in PvP-Sauber, Chat-Zeitstempel/Chat+ in Chat-Utils, Crystal-Helfer in Crystal Optimizer).\n- Launcher: neue Einstellungs-Reiter mit Suche, Absturz-Schutz für Client-Funktionen (ein Fehler in einer Funktion beendet nicht mehr das Spiel)."
    notesEn: "- New (Minecraft 26.3 only): Server Hub. A hall with portals to servers, sorted into Public / Ours / Partner / Your Servers. Open it with Right Shift, tile 8. The hub world is deleted when you leave.\n- New (Minecraft 26.3 only): Container Tracker. Remembers what is inside chests, barrels, shulker boxes and ender chests when you open them. The data stays local and survives restarts. `/nutchest <item>` finds containers holding the item and marks them in the world with the count. The module is off by default.\n- Cleanup: duplicate modules merged (e.g. totem animation into PvP Clean, chat timestamps/Chat+ into Chat Utils, crystal helpers into Crystal Optimizer).\n- Launcher: new settings tabs with search, crash protection for client features (one failing feature no longer stops the game)."
    notesFr: "- Nouveau (Minecraft 26.3 uniquement) : Hub de serveurs. Une salle avec des portails vers des serveurs, classés en Public / Ours / Partner / Your Servers. Ouvrir avec Maj droit, tuile 8. Le monde du hub est supprimé à la sortie.\n- Nouveau (Minecraft 26.3 uniquement) : Suivi des conteneurs. Mémorise le contenu des coffres, tonneaux, boîtes de shulker et coffres de l'Ender à l'ouverture. Les données restent en local et survivent aux redémarrages. `/nutchest <objet>` trouve les conteneurs qui contiennent l'objet et les marque dans le monde avec le nombre. Le module est désactivé par défaut.\n- Nettoyage : modules en double fusionnés (p. ex. animation du totem dans PvP propre, horodatage/Chat+ dans Chat-Utils, aides de cristal dans Crystal Optimizer).\n- Lanceur : nouveaux onglets de paramètres avec recherche, protection contre les plantages des fonctions client (une fonction défaillante n'arrête plus le jeu)."
    notesEs: "- Nuevo (solo Minecraft 26.3): Hub de servidores. Una sala con portales a servidores, ordenados en Public / Ours / Partner / Your Servers. Se abre con Shift derecho, mosaico 8. El mundo del hub se borra al salir.\n- Nuevo (solo Minecraft 26.3): Rastreador de contenedores. Recuerda qué hay dentro de cofres, barriles, cajas shulker y cofres de Ender al abrirlos. Los datos se guardan en local y sobreviven a los reinicios. `/nutchest <objeto>` encuentra los contenedores con ese objeto y los marca en el mundo con la cantidad. El módulo está desactivado por defecto.\n- Limpieza: módulos duplicados fusionados (p. ej. animación del tótem en PvP limpio, marcas de hora/Chat+ en Chat-Utils, ayudas de cristal en Crystal Optimizer).\n- Lanzador: nuevas pestañas de ajustes con búsqueda, protección contra fallos de las funciones del cliente (una función que falla ya no detiene el juego)."
  - version: "0.5.43"
    date: "2026-10-28"
    notes: "- Werbeblocker (Chat): blockt Web-Adressen wie name.com oder discord.gg und eigene Stichwörter.\n- Werkzeug-Warnung: meldet sich, wenn das Werkzeug in deiner Hand unter die eingestellte Haltbarkeit fällt (mit Ton).\n- Spieler-Ausblender: blendet andere Spieler aus, die dir zu nah kommen.\n- Neue HUD-Anzeigen: Uhrzeit, Himmelsrichtung, Biom und Welttag.\n- Blick-Info: zeigt Name und ID des Blocks, den du anschaust.\n- HUD-Elemente: Text-, Akzent- und Rahmenfarbe sowie Rahmenbreite einstellbar.\n- Musik-Anzeige: vier Darstellungen (Klassisch, Spotify mit Album-Cover, Minimal, Eigene mit Bild und Vorlage).\n- Weather Changer: verstärkt Regen und Gewitter nur bei dir. Echtes Wetter vom Server bleibt erhalten, damit Dreizack und Blitz weiter funktionieren."
    notesEn: "- Ad blocker (chat): blocks web addresses such as name.com or discord.gg and your own keywords.\n- Tool warning: warns you when the tool in your hand drops below the durability you set (with a sound).\n- Player hider: hides other players who come too close to you.\n- New HUD displays: clock, compass direction, biome and world day.\n- Look info: shows the name and ID of the block you are looking at.\n- HUD elements: text, accent and border color and border width can be set.\n- Music display: four looks (Classic, Spotify with album cover, Minimal, Custom with image and template).\n- Weather Changer: boosts rain and thunder only for you. Real server weather is kept, so tridents and lightning keep working."
    notesFr: "- Bloqueur de pubs (chat) : bloque les adresses web comme name.com ou discord.gg et tes propres mots-clés.\n- Alerte d'outil : prévient quand l'outil en main passe sous la durabilité choisie (avec un son).\n- Masquage des joueurs : masque les autres joueurs qui s'approchent trop.\n- Nouveaux affichages HUD : heure, direction cardinale, biome et jour du monde.\n- Infos du regard : affiche le nom et l'ID du bloc que tu regardes.\n- Éléments HUD : couleur du texte, d'accent et du cadre ainsi que l'épaisseur du cadre sont réglables.\n- Affichage musique : quatre apparences (Classique, Spotify avec pochette, Minimal, Personnalisé avec image et modèle).\n- Weather Changer : renforce la pluie et l'orage seulement pour toi. Le vrai temps du serveur est conservé, le trident et la foudre fonctionnent donc toujours."
    notesEs: "- Bloqueador de anuncios (chat): bloquea direcciones web como name.com o discord.gg y tus propias palabras clave.\n- Aviso de herramienta: avisa cuando la herramienta en tu mano baja de la durabilidad que elijas (con sonido).\n- Ocultar jugadores: oculta a otros jugadores que se acercan demasiado.\n- Nuevas pantallas HUD: hora, dirección cardinal, bioma y día del mundo.\n- Info de mirada: muestra el nombre y el ID del bloque que miras.\n- Elementos HUD: color del texto, de acento y del borde, y grosor del borde ajustables.\n- Visualización de música: cuatro aspectos (Clásico, Spotify con portada, Mínimo, Personalizado con imagen y plantilla).\n- Weather Changer: refuerza la lluvia y la tormenta solo para ti. El clima real del servidor se conserva, así que los tridentes y los rayos siguen funcionando."
  - version: "0.5.42"
    date: "2026-10-28"
    notes: "- Hotfix: Logo-Schalter ist jetzt das Modul „Logo“ (HUD). Aus = Logo im Titel-, Pause- und Hub-Menü und im HUD komplett weg.\n- Hotfix: Titel-Logo sitzt unter dem Vanilla-Logo statt darüber.\n- Hotfix: Capes werden nach einem fehlgeschlagenen Laden erneut versucht.\n- HUD-Elemente: Text-, Akzent- und Rahmenfarbe sowie Rahmenbreite einstellbar (HUD-Editor → Seitenleiste). Nur Minecraft 26.3.\n- Musik-Anzeige: vier Darstellungen (Klassisch, Spotify mit Album-Cover, Minimal, Eigene mit Bild und Vorlage). Nur Minecraft 26.3."
    notesEn: "- Hotfix: the logo switch is now the \"Logo\" module (HUD). Off = logo gone from the title, pause and hub menus and the HUD.\n- Hotfix: the title logo sits below the vanilla logo instead of on top of it.\n- Hotfix: capes are retried after a failed load.\n- HUD elements: text, accent and border color and border width can be set (HUD editor → side panel). Minecraft 26.3 only.\n- Music display: four looks (Classic, Spotify with album cover, Minimal, Custom with image and template). Minecraft 26.3 only."
    notesFr: "- Correctif : l'interrupteur du logo est maintenant le module « Logo » (HUD). Désactivé = logo retiré partout (menus titre, pause, hub et HUD).\n- Correctif : le logo du titre est placé sous le logo vanilla au lieu de dessus.\n- Correctif : les capes sont rechargées après un échec de chargement.\n- Éléments HUD : couleur du texte, d'accent et du cadre ainsi que l'épaisseur du cadre sont réglables (éditeur HUD → panneau latéral). Minecraft 26.3 uniquement.\n- Affichage musique : quatre apparences (Classique, Spotify avec pochette, Minimal, Personnalisé avec image et modèle). Minecraft 26.3 uniquement."
    notesEs: "- Hotfix: el interruptor del logo ahora es el módulo «Logo» (HUD). Desactivado = logo quitado de los menús de título, pausa y hub y del HUD.\n- Hotfix: el logo del título se muestra debajo del logo vanilla en vez de encima.\n- Hotfix: las capas se vuelven a intentar cargar tras un fallo.\n- Elementos HUD: color del texto, de acento y del borde, y grosor del borde ajustables (editor HUD → panel lateral). Solo Minecraft 26.3.\n- Visualización de música: cuatro aspectos (Clásico, Spotify con portada, Mínimo, Personalizado con imagen y plantilla). Solo Minecraft 26.3."
  - version: "0.5.41"
    date: "2026-10-28"
    notes: "- Hotfix: Fadenkreuz kann jetzt auch in der Ansicht von hinten/vorn (F5) angezeigt werden (Einstellung im Fadenkreuz-Modul, standardmäßig aus)."
    notesEn: "- Hotfix: the crosshair can now also be shown in the back/front view (F5) (setting in the crosshair module, off by default)."
    notesFr: "- Correctif : le viseur peut désormais aussi s'afficher en vue arrière/avant (F5) (réglage dans le module viseur, désactivé par défaut)."
    notesEs: "- Hotfix: la mira ahora también puede mostrarse en la vista trasera/frontal (F5) (ajuste en el módulo de mira, desactivado por defecto)."
  - version: "0.5.40"
    date: "2026-10-28"
    notes: "- Skin wechseln: Ein Skin aus der Bibliothek wird beim Anwenden zusätzlich als Skin deines Microsoft-Kontos bei Mojang hochgeladen (Offline-Konten: nur im Launcher).\n- Dein ausgerüstetes Cape wird jetzt im Launcher gezeigt: in der Skin-Ansicht, in der Vorschau und auf der Startseite (Play)."
    notesEn: "- Skin change: a skin from your library is now also uploaded to Mojang as the skin of your Microsoft account when you apply it (offline accounts: launcher only).\n- Your equipped cape is now shown in the launcher: in the skin view, in the preview and on the home page (Play)."
    notesFr: "- Changement de skin : un skin de ta bibliothèque est aussi envoyé à Mojang comme skin de ton compte Microsoft lorsque tu l'appliques (comptes hors ligne : launcher uniquement).\n- Ta cape équipée est maintenant affichée dans le launcher : dans la vue des skins, dans l'aperçu et sur la page d'accueil (Jouer)."
    notesEs: "- Cambio de skin: una skin de tu biblioteca también se sube a Mojang como skin de tu cuenta de Microsoft al aplicarla (cuentas sin conexión: solo en el launcher).\n- Tu capa equipada ahora se muestra en el launcher: en la vista de skins, en la vista previa y en la página de inicio (Jugar)."
  - version: "0.5.38"
    date: "2026-10-27"
    notes: "- „Welt öffnen“ steht jetzt an der Stelle von „Für LAN öffnen“ im Pause-Menü (nur in der Einzelspieler-Welt, nicht mehr auf Servern).\n- Der Dialog „Welt öffnen“: Titel und Status überdecken nichts mehr, die Join-Adresse steht mit Kopierknopf darunter.\n- „Eigene Domain“: die benötigten DNS-Einträge (TXT und A) haben je einen Kopierknopf.\n- „Neu verbinden“ liegt direkt unter „Zurück zur Serverliste“ und zeigt bei Auto-Beitritt einen Countdown.\n- Icon-Auswahl öffnet den Windows-Dateidialog (vorher Absturzfehler im Spiel).\n- Alle Texte des Welt-öffnen-Dialogs sind auf Englisch, Französisch und Spanisch übersetzt."
    notesEn: "- \"Welt öffnen\" now sits where \"Open to LAN\" was in the pause menu (singleplayer only, no longer shown on servers).\n- The \"Welt öffnen\" dialog no longer overlaps its title and status; the join address appears below with a copy button.\n- \"Eigene Domain\": the required DNS records (TXT and A) each have a copy button.\n- \"Neu verbinden\" sits directly below \"Back to Server List\" and shows a countdown for auto-rejoin.\n- The icon picker opens the Windows file dialog (it used to crash in-game).\n- All texts of the \"Welt öffnen\" dialog are translated to English, French and Spanish."
    notesFr: "- « Welt öffnen » remplace désormais « Ouvrir au LAN » dans le menu pause (uniquement en solo, plus affiché sur les serveurs).\n- La boîte « Welt öffnen » ne chevauche plus son titre ; l'adresse de connexion s'affiche dessous avec un bouton copier.\n- « Domaine personnalisé » : les enregistrements DNS requis (TXT et A) ont chacun un bouton copier.\n- « Neu verbinden » est juste sous « Retour au serveur » et affiche un compte à rebours pour la reconnexion automatique.\n- Le choix d'icône ouvre la boîte de dialogue Windows (il faisait planter le jeu).\n- Tous les textes de la boîte « Welt öffnen » sont traduits en anglais, français et espagnol."
    notesEs: "- « Welt öffnen » ahora está donde estaba « Abrir a LAN » en el menú de pausa (solo en un mundo individual, ya no aparece en servidores).\n- El diálogo « Welt öffnen » ya no solapa su título; la dirección de conexión aparece debajo con un botón de copiar.\n- « Dominio propio »: los registros DNS necesarios (TXT y A) tienen cada uno un botón de copiar.\n- « Neu verbinden » está justo debajo de « Volver a la lista de servidores » y muestra una cuenta atrás para la reconexión automática.\n- El selector de icono abre el diálogo de archivos de Windows (antes fallaba en el juego).\n- Todos los textos del diálogo « Welt öffnen » están traducidos al inglés, francés y español."
  - version: "0.5.37"
    date: "2026-10-27"
    notes: "- „Welt öffnen“ steht jetzt an der Stelle von „Für LAN öffnen“ im Pause-Menü (nur in der Einzelspieler-Welt, nicht mehr auf Servern).\n- Der Dialog „Welt öffnen“ zeigt Titel und Status nicht mehr über den Eingabefeldern."
    notesEn: "- \"Welt öffnen\" now sits where \"Open to LAN\" was in the pause menu (singleplayer only, no longer shown on servers).\n- The \"Welt öffnen\" dialog no longer draws its title over the input fields."
    notesFr: "- « Welt öffnen » remplace désormais « Ouvrir au LAN » dans le menu pause (uniquement en solo, plus affiché sur les serveurs).\n- La boîte de dialogue « Welt öffnen » n'affiche plus son titre par-dessus les champs de saisie."
    notesEs: "- « Welt öffnen » ahora está donde estaba « Abrir a LAN » en el menú de pausa (solo en un mundo individual, ya no aparece en servidores).\n- El diálogo « Welt öffnen » ya no dibuja su título encima de los campos de entrada."
  - version: "0.5.36"
    date: "2026-10-27"
    notes: "- „Welt öffnen“ ersetzt im Pausenmenü den Knopf „Open to LAN“ bzw. „World Options…“ (alle Versionen). Fehlt beides, erscheint er oben links unter NUTclient.\n- Replay: Im Bild-Menü gibt es den Knopf „Replay“, der den Bereich um dich speichert (alle Versionen)."
    notesEn: "- \"Open a world\" replaces the \"Open to LAN\" or \"World Options…\" button in the pause menu (all versions). If neither is there, it appears at the top left under NUTclient.\n- Replay: the image menu has a \"Replay\" button that saves the area around you (all versions)."
    notesFr: "- « Ouvrir un monde » remplace dans le menu pause le bouton « Open to LAN » ou « World Options… » (toutes les versions). Si aucun des deux n'existe, il apparaît en haut à gauche sous NUTclient.\n- Replay : le menu des images contient un bouton « Replay » qui enregistre la zone autour de toi (toutes les versions)."
    notesEs: "- «Abrir mundo» reemplaza en el menú de pausa el botón «Open to LAN» o «World Options…» (todas las versiones). Si no hay ninguno, aparece arriba a la izquierda bajo NUTclient.\n- Replay: el menú de imágenes tiene un botón «Replay» que guarda la zona a tu alrededor (todas las versiones)."
  - version: "0.5.35"
    date: "2026-10-26"
    notes: "- Hotfix: Die Versionen 1.21.10 und 1.21.11 starteten nicht mehr (Absturz beim Laden der Mod). Behoben.\n- Hotfix: Der Ton der Wurf-Bestätigung spielt nicht mehr dauerhaft, wenn ein gesperrter Slot in der Hand ist (26.3).\n- Hotfix: Skin-Suche im Launcher funktioniert wieder, auch wenn der frühere Dienst das Limit erreicht hat."
    notesEn: "- Hotfix: versions 1.21.10 and 1.21.11 no longer crashed on startup while loading the mod. Fixed.\n- Hotfix: the drop-confirmation sound no longer plays continuously while a locked slot is in hand (26.3).\n- Hotfix: skin search in the launcher works again, even when the previous service hit its limit."
    notesFr: "- Correctif : les versions 1.21.10 et 1.21.11 ne plantaient plus au démarrage lors du chargement du mod. Corrigé.\n- Correctif : le son de confirmation de lâcher ne se répète plus en continu quand un slot verrouillé est en main (26.3).\n- Correctif : la recherche de skin du lanceur fonctionne à nouveau, même si l'ancien service a atteint sa limite."
    notesEs: "- Corrección: las versiones 1.21.10 y 1.21.11 ya no se cerraban al iniciar al cargar el mod. Corregido.\n- Corrección: el sonido de confirmación al soltar ya no se repite sin parar con un slot bloqueado en la mano (26.3).\n- Corrección: la búsqueda de skins del lanzador vuelve a funcionar, incluso si el servicio anterior alcanzó su límite."
  - version: "0.5.34"
    date: "2026-10-26"
    notes: "- Hotfix: Der Ton der Wurf-Bestätigung spielt nicht mehr dauerhaft, wenn ein gesperrter Slot in der Hand ist (26.3).\n- Hotfix: Skin-Suche im Launcher funktioniert wieder, auch wenn der frühere Dienst das Limit erreicht hat."
    notesEn: "- Hotfix: the drop-confirmation sound no longer plays continuously while a locked slot is in hand (26.3).\n- Hotfix: skin search in the launcher works again, even when the previous service hit its limit."
    notesFr: "- Correctif : le son de confirmation de lâcher ne se répète plus en continu quand un slot verrouillé est en main (26.3).\n- Correctif : la recherche de skin du lanceur fonctionne à nouveau, même si l'ancien service a atteint sa limite."
    notesEs: "- Corrección: el sonido de confirmación al soltar ya no se repite sin parar con un slot bloqueado en la mano (26.3).\n- Corrección: la búsqueda de skins del lanzador vuelve a funcionar, incluso si el servicio anterior alcanzó su límite."
  - version: "0.5.33"
    date: "2026-10-26"
    notes: "- Cape einreichen: zu große 2:1-Bilder (z. B. 4096×2048) werden automatisch auf 2048×1024 verkleinert.\n- Freigegebene Capes lassen sich im Schrank ausrüsten und laden dann im Spiel."
    notesEn: "- Cape submission: oversized 2:1 images (e.g. 4096×2048) are scaled down automatically to 2048×1024.\n- Approved capes can be equipped in the locker and then load in game."
    notesFr: "- Envoi de cape : les images 2:1 trop grandes (ex. 4096×2048) sont réduites automatiquement à 2048×1024.\n- Les capes approuvées peuvent être équipées dans le casier et s'affichent ensuite en jeu."
    notesEs: "- Envío de capa: las imágenes 2:1 demasiado grandes (p. ej. 4096×2048) se reducen automáticamente a 2048×1024.\n- Las capas aprobadas se pueden equipar en el armario y luego se cargan en el juego."
  - version: "0.5.32"
    date: "2026-10-26"
    notes: "- Hotfix: Der Server-Hub wurde komplett entfernt.\n- Neu: Stürzt das Spiel ab, öffnet der Launcher ein Fenster mit „Logs hochladen“ und „KI-Analyse“. Das Log-Fenster kann die Logs ebenfalls hochladen."
    notesEn: "- Hotfix: the server hub has been removed completely.\n- New: if the game crashes, the launcher opens a window with \"Upload logs\" and \"AI analysis\". The log window can upload logs too."
    notesFr: "- Correctif : le hub de serveurs a été entièrement supprimé.\n- Nouveau : si le jeu plante, le lanceur ouvre une fenêtre avec « Envoyer les logs » et « Analyse IA ». La fenêtre des logs peut aussi envoyer les logs."
    notesEs: "- Corrección: el hub de servidores se ha eliminado por completo.\n- Nuevo: si el juego se cierra por un fallo, el lanzador abre una ventana con «Subir logs» y «Análisis IA». La ventana de logs también puede subir los logs."
  - version: "0.5.31"
    date: "2026-10-26"
    notes: "- Server-Hub: eigener Eintrag ganz oben in der Serverliste, Portale zu Servern. Server mit Versionsliste ohne 26.3 werden nicht verbunden, mit Hinweis im Chat.\n- Neu verbinden: Knopf im Trennungs-Fenster, optional automatischer Neubeitritt (Modul „Reconnect“). Nicht bei Kick, Bann oder Whitelist.\n- N-Knopf im Titelbildschirm öffnet das NUTclient-Menü.\n- Wolken-Regler (Vanilla / Aus / Schnell / Schön) und Partikel-Regler (maximale Entfernung, Obergrenze pro Tick) im Partikel-Modul.\n- Übersetzungen: „Neu verbinden“ auf Englisch, Französisch und Spanisch.\n- Offline spielen: wer zuletzt online mit einem freigegebenen Konto war, kommt auch ohne Netz rein.\n- Welt öffnen: Schalter für Online-Modus (Standard an) und Cheats/Befehle. Der Besitzer der Welt kann nicht per Befehl von anderen gekickt, gebannt oder getötet werden.\n- Drop-Bestätigung abschaltbar: nur der Slot-Lock bleibt (26.3).\n- Fix: Absturz beim Start in 1.21.8 und 1.21.10 behoben, Pack-Liste (26.3)."
    notesEn: "- Server hub: its own entry at the top of the server list with portals to servers. Servers whose version list excludes 26.3 are not joined; a chat message explains why.\n- Reconnect: button on the disconnect screen, optional automatic rejoin (module \"Reconnect\"). Not after kick, ban or whitelist.\n- N button on the title screen opens the NUTclient menu.\n- Cloud setting (Vanilla / Off / Fast / Fancy) and particle controls (maximum distance, per-tick cap) in the particle module.\n- Translations: \"Neu verbinden\" in English, French and Spanish.\n- Offline play: if you were last online with an allowed account, you can play without a connection.\n- Open world: switch for online mode (default on) and cheats/commands. The world owner cannot be kicked, banned or killed by commands from others.\n- Drop confirmation can be turned off: only the slot lock stays (26.3).\n- Fix: startup crash in 1.21.8 and 1.21.10 fixed, pack list (26.3)."
    notesFr: "- Hub de serveurs : entrée propre en haut de la liste des serveurs, avec des portails vers les serveurs. Les serveurs dont la liste de versions exclut 26.3 ne sont pas rejoints ; un message dans le chat l'explique.\n- Reconnexion : bouton dans l'écran de déconnexion, reconnexion automatique facultative (module « Reconnect »). Pas après un kick, un bannissement ou une whitelist.\n- Le bouton N de l'écran titre ouvre le menu NUTclient.\n- Réglage des nuages (Vanilla / Désactivé / Rapide / Beau) et des particules (distance maximale, limite par tick) dans le module particules.\n- Traductions : « Neu verbinden » en anglais, français et espagnol.\n- Jeu hors ligne : si ton dernier compte autorisé était connecté, tu peux jouer sans réseau.\n- Ouvrir un monde : interrupteur du mode en ligne (activé par défaut) et des commandes. Le propriétaire ne peut pas être expulsé, banni ou tué par les commandes d'autres joueurs.\n- Confirmation de lâcher désactivable : seul le verrou de slot reste (26.3).\n- Correction : plantage au démarrage en 1.21.8 et 1.21.10 corrigé, liste des packs (26.3)."
    notesEs: "- Hub de servidores: entrada propia arriba de la lista de servidores, con portales a los servidores. Los servidores cuya lista de versiones no incluye 26.3 no se conectan; un mensaje en el chat lo explica.\n- Reconectar: botón en la pantalla de desconexión, reconexión automática opcional (módulo \"Reconnect\"). No tras expulsión, baneo o whitelist.\n- El botón N de la pantalla de título abre el menú de NUTclient.\n- Ajuste de nubes (Vanilla / Apagado / Rápido / Bonito) y de partículas (distancia máxima, límite por tick) en el módulo de partículas.\n- Traducciones: \"Neu verbinden\" en inglés, francés y español.\n- Jugar sin conexión: si tu última cuenta permitida estaba conectada, puedes jugar sin red.\n- Abrir mundo: interruptor del modo en línea (activado por defecto) y de comandos. El dueño del mundo no puede ser expulsado, baneado ni eliminado por comandos de otros.\n- Confirmación al soltar desactivable: solo queda el bloqueo de slot (26.3).\n- Corrección: fallo al iniciar en 1.21.8 y 1.21.10 corregido, lista de packs (26.3)."
  - version: "0.5.29"
    date: "2026-10-22"
    notes: "- Neu (nur 26.3, Beta): Server-Hub – eine Halle mit Portalen zu Servern (Public / Ours / Partner / Your Servers). Aufruf: Rechts-Shift, Kachel 8. Die Welt wird beim Verlassen wieder gelöscht.\n- Aufgeräumt: doppelte Module sind zusammengelegt (z. B. Totem-Animation in PvP-Sauber, Chat-Zeitstempel/Chat+ in Chat-Utils).\n- Neue Einstellungs-Reiter im Launcher, Absturz-Schutz für Client-Funktionen."
    notesEn: "- New (26.3 only, beta): Server Hub – a hall with portals to servers (Public / Ours / Partner / Your Servers). Open it with Right Shift, tile 8. The world is deleted when you leave.\n- Cleanup: duplicate modules merged (e.g. totem animation into PvP Clean, chat timestamps/Chat+ into Chat Utils).\n- New settings tabs in the launcher, crash protection for client features."
    notesFr: "- Nouveau (26.3 uniquement, bêta) : Hub de serveurs – une salle avec des portails vers des serveurs (Public / Ours / Partner / Your Servers). Ouvrir avec Shift droit, tuile 8. Le monde est supprimé en le quittant.\n- Nettoyage : modules en double fusionnés (p. ex. animation du totem dans PvP propre, horodatage/Chat+ dans Chat-Utils).\n- Nouveaux onglets de paramètres dans le lanceur, protection contre les plantages."
    notesEs: "- Nuevo (solo 26.3, beta): Hub de servidores – una sala con portales a servidores (Public / Ours / Partner / Your Servers). Se abre con Shift derecho, mosaico 8. El mundo se borra al salir.\n- Limpieza: módulos duplicados fusionados (p. ej. animación del tótem en PvP limpio, marcas de hora/Chat+ en Chat-Utils).\n- Nuevas pestañas de ajustes en el lanzador, protección contra fallos."
  - version: "0.5.28"
    date: "2026-10-22"
    notes: "- Behoben: Ein Fehler in einer einzelnen Funktion (z. B. Kill-Effekte, Clip-Erkennung, Kampf-Anzeige) kann das Spiel nicht mehr zum Absturz bringen – der Fehler wird geloggt und das Spiel läuft weiter"
    notesEn: "- Fixed: an error in a single feature (e.g. kill effects, clip detection, combat display) can no longer crash the game – the error is logged and the game keeps running"
    notesFr: "- Corrigé : une erreur dans une seule fonction (p. ex. effets de kill, détection de clips, affichage de combat) ne peut plus faire planter le jeu – l'erreur est consignée et le jeu continue"
    notesEs: "- Corregido: un error en una sola función (p. ej. efectos de kill, detección de clips, panel de combate) ya no puede bloquear el juego – el error se registra y el juego sigue"
  - version: "0.5.27"
    date: "2026-10-22"
    notes: "- Neu: Serverordner (Server aufeinander ziehen) und Resourcepack-Ordner (auch echte Unterordner in resourcepacks/) jetzt auch in 26.2, 26.1.x, 1.21.9–1.21.11 (zuvor nur 26.3)"
    notesEn: "- New: server folders (drag servers onto each other) and resource pack folders (including real subfolders in resourcepacks/) now also in 26.2, 26.1.x, 1.21.9–1.21.11 (previously 26.3 only)"
    notesFr: "- Nouveau : dossiers de serveurs (glisser les serveurs l'un sur l'autre) et dossiers de packs de ressources (y compris de vrais sous-dossiers de resourcepacks/) aussi dans 26.2, 26.1.x, 1.21.9–1.21.11 (auparavant 26.3 uniquement)"
    notesEs: "- Nuevo: carpetas de servidores (arrastra servidores uno sobre otro) y carpetas de packs de recursos (incluidas subcarpetas reales de resourcepacks/) ahora también en 26.2, 26.1.x, 1.21.9–1.21.11 (antes solo 26.3)"
  - version: "0.5.26"
    date: "2026-10-20"
    notes: "- Behoben: Tiers fragt bei einem Ausfall von pvptiers.com nicht mehr für jeden Spieler einzeln an (2 Minuten Pause, einmaliger Hinweis, danach automatisch wieder)"
    notesEn: "- Fixed: Tiers no longer queries every player separately when pvptiers.com is down (2-minute pause, one notice, then automatic retry)"
    notesFr: "- Corrigé : Tiers n'interroge plus chaque joueur séparément quand pvptiers.com est en panne (pause de 2 minutes, un seul avis, puis nouvelle tentative automatique)"
    notesEs: "- Corregido: Tiers ya no consulta a cada jugador por separado cuando pvptiers.com está caído (pausa de 2 minutos, un aviso y reintento automático)"
  - version: "0.5.25"
    date: "2026-10-20"
    notes: "- Behoben: FPS-Einbruch bei allen Instanzen – das eigene Java-Speicher-Tuning (aggressive G1-Werte) ist entfernt, Minecraft startet wieder mit den normalen Java-Standardwerten\n- Verbessert: Der Hänger-Wächter belastet das Spiel weniger"
    notesEn: "- Fixed: FPS drop on all instances – the custom Java memory tuning (aggressive G1 values) is removed, Minecraft starts with normal Java defaults again\n- Improved: the stall watchdog puts less load on the game"
    notesFr: "- Corrigé : chute de FPS sur toutes les instances – le réglage mémoire Java personnalisé (valeurs G1 agressives) est supprimé, Minecraft démarre de nouveau avec les valeurs Java par défaut\n- Amélioré : le détecteur de saccades charge moins le jeu"
    notesEs: "- Corregido: caída de FPS en todas las instancias – se elimina el ajuste de memoria de Java personalizado (valores G1 agresivos), Minecraft arranca de nuevo con los valores predeterminados de Java\n- Mejorado: el vigilante de tirones carga menos el juego"
  - version: "0.5.24"
    date: "2026-10-20"
    notes: "- Behoben: FPS-Einbruch – Modul-Prüfungen (Server-Regeln, WorldEdit-Erkennung) liefen bei jedem Bild hundertfach und durchsuchten dabei Befehlsbäume; jetzt zwischengespeichert\n- Behoben: „Konto: …“-Knopf erschien mehrfach untereinander"
    notesEn: "- Fixed: FPS drop – module checks (server rules, WorldEdit detection) ran hundreds of times per frame and scanned command trees; now cached\n- Fixed: the \"Account: …\" button appeared several times stacked"
    notesFr: "- Corrigé : chute de FPS – les vérifications de modules (règles de serveur, détection de WorldEdit) s'exécutaient des centaines de fois par image et parcouraient les arbres de commandes ; désormais mises en cache\n- Corrigé : le bouton « Compte : … » apparaissait plusieurs fois empilé"
    notesEs: "- Corregido: caída de FPS – las comprobaciones de módulos (reglas de servidor, detección de WorldEdit) se ejecutaban cientos de veces por fotograma y recorrían árboles de comandos; ahora se guardan en caché\n- Corregido: el botón «Cuenta: …» aparecía varias veces apilado"
  - version: "0.5.23"
    date: "2026-10-20"
    notes: "- Neu: Server-Ordner in der Serverliste (Server aufeinander ziehen, Klick klappt auf/zu, Doppelklick öffnet, Entf löst auf) – nur Minecraft 26.3\n- Neu: Resourcepack-Ordner – Unterordner von resourcepacks/ werden erkannt, Packs per Ziehen in Ordner legen – nur Minecraft 26.3\n- Neu: Screenshots posten und hochladen ohne Imgur-Konto (direkt zum NUTclient-Server, 4 MB, 25 pro Tag)\n- Neu: Creator-Dashboard im Launcher (Unterstützer, Downloads, Installationen mit deinem Code)\n- Verbessert: Ping zeigt jetzt die echte Zeit bis zum Server (Ping-Paket wie F3) statt der Zeit bis zum Proxy\n- Verbessert: Dynamic FPS entfernt – keine kurze 2-FPS-Phase mehr nach Alt-Tab\n- Verbessert: Health Indicator sitzt fest über dem Namensschild, läuft geschmeidig und ist auch durch Wände sichtbar\n- Verbessert: Launcher – Musik-Karte unter der oberen Leiste (überdeckt nichts mehr), Hauptknöpfe mit Farbverlauf, Buttons überlappen sich nicht mehr"
    notesEn: "- New: server folders in the server list (drag servers onto each other, click to expand/collapse, double-click to open, Del to dissolve) – Minecraft 26.3 only\n- New: resource pack folders – subfolders of resourcepacks/ are recognised, drag packs into folders – Minecraft 26.3 only\n- New: post and upload screenshots without an Imgur account (straight to the NUTclient server, 4 MB, 25 per day)\n- New: creator dashboard in the launcher (supporters, downloads, installs with your code)\n- Improved: ping now shows the real time to the server (ping packet like F3) instead of the time to the proxy\n- Improved: Dynamic FPS removed – no more short 2 FPS phase after alt-tab\n- Improved: Health Indicator sits firmly above the name tag, animates smoothly and is visible through walls\n- Improved: launcher – music card below the top bar (covers nothing any more), gradient primary buttons, buttons no longer overlap"
    notesFr: "- Nouveau : dossiers de serveurs dans la liste (glisser les serveurs l'un sur l'autre, clic pour déplier/replier, double-clic pour ouvrir, Suppr pour dissoudre) – Minecraft 26.3 uniquement\n- Nouveau : dossiers de packs de ressources – les sous-dossiers de resourcepacks/ sont reconnus, glisser les packs dans des dossiers – Minecraft 26.3 uniquement\n- Nouveau : publier et téléverser des captures d'écran sans compte Imgur (directement vers le serveur NUTclient, 4 Mo, 25 par jour)\n- Nouveau : tableau de bord créateur dans le launcher (soutiens, téléchargements, installations avec ton code)\n- Amélioré : le ping affiche désormais le vrai temps jusqu'au serveur (paquet de ping comme F3) et non jusqu'au proxy\n- Amélioré : Dynamic FPS supprimé – plus de courte phase à 2 FPS après un Alt-Tab\n- Amélioré : l'Health Indicator reste fixé au-dessus du pseudo, s'anime en douceur et est visible à travers les murs\n- Amélioré : launcher – carte musique sous la barre du haut (ne cache plus rien), boutons principaux en dégradé, boutons qui ne se chevauchent plus"
    notesEs: "- Nuevo: carpetas de servidores en la lista (arrastra servidores uno sobre otro, clic para abrir/cerrar, doble clic para entrar, Supr para disolver) – solo Minecraft 26.3\n- Nuevo: carpetas de packs de recursos – se reconocen las subcarpetas de resourcepacks/, arrastra packs a carpetas – solo Minecraft 26.3\n- Nuevo: publicar y subir capturas sin cuenta de Imgur (directo al servidor de NUTclient, 4 MB, 25 al día)\n- Nuevo: panel de creador en el launcher (seguidores, descargas, instalaciones con tu código)\n- Mejorado: el ping muestra ahora el tiempo real hasta el servidor (paquete de ping como F3) y no hasta el proxy\n- Mejorado: se elimina Dynamic FPS – sin la breve fase de 2 FPS tras el Alt-Tab\n- Mejorado: el Health Indicator queda fijo sobre el nombre, se anima con suavidad y se ve a través de las paredes\n- Mejorado: launcher – tarjeta de música bajo la barra superior (ya no tapa nada), botones principales con degradado, los botones ya no se superponen"
  - version: "0.5.22"
    date: "2026-10-19"
    notes: "- Neu: Launcher im neuen Design „NUT Navy“ – Seitenleiste mit Text, obere Leiste (News, Accounts, Logo, Glocke, Clips, Instanzen-Overview), Startseite mit Spieler-Feld und „Spielen“; neue Menüs „News“ (alle Changelogs) und „Instanzen-Overview“ (Live-Logs aller laufenden Instanzen)\n- Neu: Alle Menüs im Spiel im gleichen Stil (dunkelblau mit hellblauem Akzent)\n- Neu: Modul „Health Indicator“ (Herzen, Leiste, Zahl oder Leiste + Zahl über dem Kopf) – das Leben ist dafür aus den Namensschildern raus\n- Neu: HUD-Modul „Spieler-Modell“ – du selbst als 3D-Modell im HUD, 1:1 wie du aussiehst, sehr viele Einstellungen\n- Neu: Follow-System – folgen, zurückfolgen = befreundet; Nachrichten von Nicht-Freunden als Anfrage mit Annehmen/Ablehnen; Privatsphäre-Einstellungen; Freunde auf dem Server als Köpfe in der Serverliste\n- Neu: Creator-Kit – mit dem Code eines Creators dessen Server, Packs, Mods und Einstellungen übernehmen; Creator können ihr Kit bearbeiten und geheime Packs hochladen (werden als versteckte Mod geladen)\n- Neu: Capes einreichen (Skin-Menü) – das Team gibt sie im Discord frei; Cosmetics aufgeräumt: nur noch Heiligenschein und Engelsflügel (OG für die erste Beta) und die Emotes\n- Neu: Rollen-Zeichen (Admin, Team, NUT+, Creator, Beta Tester) immer über dem Namen; Benachrichtigungen komplett abschaltbar\n- Neu: Beim ersten Start Zustimmung zu Nutzungsbedingungen und Datenschutzerklärung; danach wird die Installation registriert (Einstellungen → Tracking → Zustimmung widerrufen und Daten löschen)\n- Fix: /nutrules ging manchmal mitten im Kampf auf (Linksklick bei gefangener Maus); Server-Regeln gehen nicht mehr zufällig verloren\n- Fix: Launcher sichert Instanzen und Einstellungen in eine Datei und stellt sie bei leerem Speicher wieder her"
    notesEn: "- New: Launcher in the new “NUT Navy” design – text sidebar, top bar (News, Accounts, logo, bell, Clips, Instance overview), home with player box and “Play”; new menus “News” (all changelogs) and “Instance overview” (live logs of all running instances)\n- New: All in-game menus in the same style (dark blue with a light-blue accent)\n- New: “Health Indicator” module (hearts, bar, number or bar + number above the head) – health is no longer part of the name tags\n- New: “Player Model” HUD module – you as a 3D model in the HUD, 1:1 as you look, with lots of settings\n- New: Follow system – follow, follow back = friends; messages from non-friends as a request you accept or decline; privacy settings; friends on a server shown as heads in the server list\n- New: Creator kit – enter a creator’s code to copy their servers, packs, mods and settings; creators can edit their kit and upload secret packs (loaded as a hidden mod)\n- New: Submit capes (Skin menu) – the team approves them on Discord; cosmetics cleaned up: only the halo and angel wings (OG for the first beta) and the emotes remain\n- New: Role badges (Admin, Team, NUT+, Creator, Beta Tester) always shown above names; notifications can be turned off completely\n- New: At first start you accept the Terms of Use and Privacy Policy; the installation is then registered (Settings → Tracking → Withdraw consent and delete data)\n- Fix: /nutrules sometimes opened in the middle of a fight (left click while the mouse was grabbed); server rules no longer get lost at random\n- Fix: The launcher mirrors instances and settings to a file and restores them if its storage is empty"
    notesFr: "- Nouveau : launcher au nouveau design « NUT Navy » – barre latérale texte, barre supérieure (News, Comptes, logo, cloche, Clips, Aperçu des instances), accueil avec zone joueur et « Jouer » ; nouveaux menus « News » (tous les changelogs) et « Aperçu des instances » (logs en direct de toutes les instances)\n- Nouveau : tous les menus en jeu dans le même style (bleu foncé, accent bleu clair)\n- Nouveau : module « Health Indicator » (cœurs, barre, nombre ou barre + nombre au-dessus de la tête) – la vie n’est plus dans les pseudos\n- Nouveau : module HUD « Modèle du joueur » – toi en modèle 3D dans le HUD, fidèle à ton apparence, très configurable\n- Nouveau : système de suivi – suivre, suivre en retour = amis ; messages de non-amis sous forme de demande à accepter ou refuser ; réglages de confidentialité ; amis présents sur un serveur affichés en têtes dans la liste\n- Nouveau : kit créateur – saisis le code d’un créateur pour copier ses serveurs, packs, mods et réglages ; les créateurs peuvent modifier leur kit et envoyer des packs secrets (chargés comme mod caché)\n- Nouveau : soumettre des capes (menu Skin) – l’équipe les valide sur Discord ; cosmétiques nettoyés : seuls le halo et les ailes d’ange (OG pour la première bêta) et les emotes restent\n- Nouveau : badges de rôle (Admin, Team, NUT+, Créateur, Bêta testeur) toujours affichés au-dessus du nom ; notifications désactivables\n- Nouveau : au premier lancement, acceptation des conditions d’utilisation et de la politique de confidentialité ; l’installation est ensuite enregistrée (Réglages → Suivi → Retirer le consentement et supprimer les données)\n- Correction : /nutrules s’ouvrait parfois en plein combat (clic gauche souris capturée) ; les règles de serveur ne se perdent plus au hasard\n- Correction : le launcher sauvegarde instances et réglages dans un fichier et les restaure si son stockage est vide"
    notesEs: "- Nuevo: launcher con el nuevo diseño «NUT Navy» – barra lateral de texto, barra superior (News, Cuentas, logo, campana, Clips, Resumen de instancias), inicio con el jugador y «Jugar»; nuevos menús «News» (todos los changelogs) y «Resumen de instancias» (logs en vivo de todas las instancias)\n- Nuevo: todos los menús del juego con el mismo estilo (azul oscuro con acento azul claro)\n- Nuevo: módulo «Health Indicator» (corazones, barra, número o barra + número sobre la cabeza) – la vida ya no está en los nombres\n- Nuevo: módulo HUD «Modelo del jugador» – tú como modelo 3D en el HUD, igual que te ves, muy configurable\n- Nuevo: sistema de seguimiento – seguir, seguir de vuelta = amigos; mensajes de no amigos como solicitud que aceptas o rechazas; ajustes de privacidad; amigos en un servidor como cabezas en la lista\n- Nuevo: kit de creador – introduce el código de un creador para copiar sus servidores, packs, mods y ajustes; los creadores pueden editar su kit y subir packs secretos (cargados como mod oculto)\n- Nuevo: enviar capas (menú Skin) – el equipo las aprueba en Discord; cosméticos depurados: solo quedan el halo y las alas de ángel (OG de la primera beta) y los emotes\n- Nuevo: insignias de rol (Admin, Team, NUT+, Creador, Beta tester) siempre sobre el nombre; notificaciones desactivables\n- Nuevo: en el primer inicio se aceptan las condiciones de uso y la política de privacidad; luego se registra la instalación (Ajustes → Seguimiento → Retirar consentimiento y borrar datos)\n- Corrección: /nutrules se abría a veces en pleno combate (clic izquierdo con el ratón capturado); las reglas de servidor ya no se pierden al azar\n- Corrección: el launcher guarda instancias y ajustes en un archivo y los restaura si su almacenamiento está vacío"
  - version: "0.5.21"
    date: "2026-10-18"
    notes: "- Neu: Weniger Lag-Spitzen – Minecraft startet mit Java-Einstellungen für kurze Speicherbereinigungs-Pausen und festem Start-Speicher (wenn du nicht schon eigene Argumente dafür gesetzt hast)\n- Neu: Die Ping-Anzeige zeigt auf Wunsch Netz-Schwankung und PC-Ruckler, so siehst du, ob Lag vom Netzwerk oder vom eigenen PC kommt\n- Neu: Ruckler-Wächter – bei Hängern schreibt der Client in logs/nutclient-stalls.log auf, was das Spiel gerade tat, damit Ruckler gezielt behoben werden können"
    notesEn: "- New: Fewer lag spikes – Minecraft now starts with Java settings for short garbage-collection pauses and a fixed starting heap (unless you already set your own arguments for that)\n- New: The ping display can show network jitter and PC stutters, so you can see whether lag comes from the network or your own PC\n- New: Stutter watchdog – on freezes the client writes what the game was doing to logs/nutclient-stalls.log so stutters can be fixed precisely"
    notesFr: "- Nouveau : moins de pics de lag – Minecraft démarre avec des réglages Java pour de courtes pauses du ramasse-miettes et une mémoire de départ fixe (sauf si tu as déjà tes propres arguments)\n- Nouveau : l’affichage du ping peut montrer la variation réseau et les saccades du PC, pour voir si le lag vient du réseau ou de ton PC\n- Nouveau : surveillance des saccades – lors d’un gel, le client note dans logs/nutclient-stalls.log ce que faisait le jeu, afin de corriger précisément les saccades"
    notesEs: "- Nuevo: menos picos de lag – Minecraft arranca con ajustes de Java para pausas cortas del recolector de basura y memoria inicial fija (salvo que ya tengas tus propios argumentos)\n- Nuevo: el indicador de ping puede mostrar la variación de red y los tirones del PC, para ver si el lag viene de la red o de tu PC\n- Nuevo: vigilante de tirones – en los bloqueos el cliente anota en logs/nutclient-stalls.log lo que hacía el juego, para corregir los tirones con precisión"
  - version: "0.5.20"
    date: "2026-10-17"
    notes: "- Neu: „Changelogs ansehen“ in den Einstellungen und im Update-Fenster – alle Changelogs in allen Sprachen\n- Neu: Profile 2.0 auf allen Versionen – sichern auch Grafik-, Tasten-, Sound-, Chat- und Skin-Einstellungen (je Bereich wählbar), Farbe, Notiz, Umbenennen, Duplizieren, Teilen per Code, Vorschau der Änderungen, automatisch zurück zum vorigen Profil, Knopf im Optionsmenü\n- Neu: Resourcepacks per Link installieren (Modrinth-Seite oder .zip-Link), optional gleich aktivieren und in einen Pack-Ordner legen\n- Neu: Ping wird jetzt echt gemessen statt des oft viel zu hohen Serverwerts\n- Fix: Die Meldung „Module gesperrt“ erscheint nur noch beim Beitritt über die Serverliste, nicht mehr bei Server-Wechseln (z. B. Duelle)\n- Fix: Knöpfe im Resourcepack-Menü überlappen die Listen nicht mehr, der Konto-Knopf passt sich dem Namen an"
    notesEn: "- New: “View changelogs” in Settings and the update window – all changelogs in all languages\n- New: Profiles 2.0 on all versions – now also save graphics, controls, sound, chat and skin settings (selectable per area), color, note, rename, duplicate, share by code, change preview, automatic return to the previous profile, button in the options menu\n- New: Install resource packs by link (Modrinth page or .zip link), optionally activate right away and put into a pack folder\n- New: Ping is now really measured instead of the often far too high server value\n- Fix: The “modules locked” notice now only appears when joining from the server list, not on server transfers (e.g. duels)\n- Fix: Buttons in the resource pack screen no longer overlap the lists, the account button fits the name"
    notesFr: "- Nouveau : « Voir les changelogs » dans les paramètres et la fenêtre de mise à jour – tous les changelogs dans toutes les langues\n- Nouveau : Profils 2.0 sur toutes les versions – enregistrent aussi les réglages graphiques, touches, son, chat et skin (au choix), couleur, note, renommer, dupliquer, partage par code, aperçu des changements, retour automatique au profil précédent, bouton dans le menu d’options\n- Nouveau : installer des packs de ressources par lien (page Modrinth ou lien .zip), activation immédiate possible et rangement dans un dossier\n- Nouveau : le ping est maintenant vraiment mesuré, au lieu de la valeur du serveur souvent bien trop élevée\n- Correction : l’avis « modules bloqués » n’apparaît plus qu’en rejoignant depuis la liste des serveurs, pas lors des changements de serveur (p. ex. duels)\n- Correction : les boutons du menu des packs ne chevauchent plus les listes, le bouton de compte s’adapte au nom"
    notesEs: "- Nuevo: «Ver changelogs» en Ajustes y en la ventana de actualización – todos los changelogs en todos los idiomas\n- Nuevo: Perfiles 2.0 en todas las versiones – guardan también ajustes de gráficos, teclas, sonido, chat y skin (a elegir por área), color, nota, renombrar, duplicar, compartir por código, vista previa de cambios, vuelta automática al perfil anterior, botón en el menú de opciones\n- Nuevo: instalar paquetes de recursos por enlace (página de Modrinth o enlace .zip), con activación inmediata opcional y carpeta de paquetes\n- Nuevo: el ping ahora se mide de verdad en lugar del valor del servidor, a menudo demasiado alto\n- Corrección: el aviso «módulos bloqueados» solo aparece al entrar desde la lista de servidores, no en cambios de servidor (p. ej. duelos)\n- Corrección: los botones del menú de paquetes ya no se superponen a las listas, el botón de cuenta se ajusta al nombre"
  - version: "0.5.19"
    date: "2026-10-17"
    notes: "- Neu: Resourcepack-Ordner & Presets (Knopf im Pack-Menü): eigene Ordner, Packs sperren, Presets sichern, Ordner/Presets schalten sich beim Beitritt zu einem Server automatisch ein\n- Neu: HUD-Editor mit „+“-Knopf, Einstellungen als Seitenleiste mit Live-Vorschau, Split-Chat-Fenster direkt im Editor verschieb- und skalierbar\n- Neu: Profile (Menü → Profile): Einstellungen + Resourcepacks speichern, per Knopf oder automatisch beim Beitritt zu Server/Welt wechseln, Module je Profil erzwingen (ersetzt „Einstellungen sichern“)\n- Neu: Kamera-Tasten (F5-Perspektiven auf Tasten, Halten/Umschalten), NUTclient-Tasten im Vanilla-Tastenmenü\n- Änderung: HUD-Module nicht mehr in der Modulliste; Flugtempo läuft nur noch im Hintergrund (Strg + Mausrad); Eimer-Fix entfernt; Crystal Optimizer standardmäßig aus\n- Neu: Server-Regeln mit Detail-Fenster (alle gesperrten Module im Volltext), pro Server „nicht mehr melden“ oder „ignorieren“ (langes Halten), /nutrules\n- Neu: Benachrichtigungen bleiben bis Klick/Hover, max. 5, liegen über allen Menüs und dem Ladebildschirm\n- Neu: Server-Banner und -Icons in der Serverliste (aus den Server-Mappings: Lunar, NoRisk u. a.)\n- Neu: TNT-Timer, Arrow Trail, Time Changer, Weather Changer\n- Fix: Beitritt scheitert mit „ungültige Chat-Signatur“ (Konto-Prüfung, Schlüssel-Reparatur, Beitritt ohne Schlüssel)\n- Launcher: Support-ID mit „Support-Daten senden“, echtes Mouse Tweaks wird nicht mehr installiert, Log-Fenster/Start-Overlay-Fixes"
    notesEn: "- New: resource pack folders & presets (button in the pack menu): own folders, lock packs, save presets, folders/presets switch on automatically when joining a server\n- New: HUD editor with a \"+\" button, settings as a side panel with live preview, split-chat windows movable/resizable right in the editor\n- New: profiles (menu → Profiles): save settings + resource packs, switch by button or automatically when joining a server/world, force modules per profile (replaces \"back up settings\")\n- New: camera keys (F5 perspectives on keys, hold/toggle), NUTclient keys in the vanilla controls menu\n- Change: HUD modules no longer in the module list; flight speed now runs in the background only (Ctrl + wheel); bucket fix removed; Crystal Optimizer off by default\n- New: server rules with a detail screen (all locked modules in full), per server \"don't notify again\" or \"ignore\" (long press), /nutrules\n- New: notifications stay until clicked/hovered, max 5, drawn above every menu and the loading screen\n- New: server banners and icons in the server list (from the server mappings: Lunar, NoRisk, …)\n- New: TNT Timer, Arrow Trail, Time Changer, Weather Changer\n- Fix: joining fails with \"invalid chat signature\" (account check, key repair, join without key)\n- Launcher: support ID with \"send support data\", the real Mouse Tweaks mod is no longer installed, log window / launch overlay fixes"
    notesFr: "- Nouveau : dossiers et préréglages de packs de ressources (bouton dans le menu des packs) : dossiers, verrouillage, préréglages, activation automatique par serveur\n- Nouveau : éditeur HUD avec bouton « + », réglages en panneau latéral avec aperçu en direct, fenêtres de chat séparé déplaçables/redimensionnables dans l'éditeur\n- Nouveau : profils (menu → Profils) : enregistrer réglages + packs de ressources, changer par bouton ou automatiquement en rejoignant un serveur/monde, forcer des modules par profil\n- Nouveau : touches caméra (perspectives F5 sur des touches), touches NUTclient dans le menu des commandes vanilla\n- Changement : modules HUD hors de la liste ; vitesse de vol en arrière-plan uniquement ; Bucket-Fix retiré ; Crystal Optimizer désactivé par défaut\n- Nouveau : règles du serveur avec écran de détails (tous les modules bloqués en entier), par serveur « ne plus notifier » ou « ignorer » (appui long), /nutrules\n- Nouveau : les notifications restent jusqu'au clic/survol, 5 max, au-dessus de tous les menus et de l'écran de chargement\n- Nouveau : bannières et icônes de serveur dans la liste (depuis les mappings : Lunar, NoRisk, …)\n- Nouveau : TNT Timer, Arrow Trail, Time Changer, Weather Changer\n- Correctif : connexion refusée « signature de chat invalide » (vérification du compte, réparation de la clé, connexion sans clé)\n- Launcher : ID de support avec « envoyer les données », le vrai Mouse Tweaks n'est plus installé, correctifs fenêtre de logs / overlay de lancement"
    notesEs: "- Nuevo: carpetas y ajustes preestablecidos de paquetes de recursos (botón en el menú de paquetes): carpetas, bloqueo, presets, activación automática por servidor\n- Nuevo: editor HUD con botón «+», ajustes en panel lateral con vista previa en vivo, ventanas de chat dividido movibles/redimensionables en el editor\n- Nuevo: perfiles (menú → Perfiles): guardar ajustes + paquetes de recursos, cambiar con botón o automáticamente al entrar a un servidor/mundo, forzar módulos por perfil\n- Nuevo: teclas de cámara (perspectivas F5 en teclas), teclas NUTclient en el menú de controles vanilla\n- Cambio: módulos HUD fuera de la lista; velocidad de vuelo solo en segundo plano; Bucket-Fix eliminado; Crystal Optimizer desactivado por defecto\n- Nuevo: reglas del servidor con pantalla de detalles (todos los módulos bloqueados completos), por servidor «no avisar más» o «ignorar» (pulsación larga), /nutrules\n- Nuevo: las notificaciones permanecen hasta clic/hover, máx. 5, sobre todos los menús y la pantalla de carga\n- Nuevo: banners e iconos de servidor en la lista (de los mappings: Lunar, NoRisk, …)\n- Nuevo: TNT Timer, Arrow Trail, Time Changer, Weather Changer\n- Corrección: fallo al entrar por «firma de chat no válida» (comprobación de cuenta, reparación de clave, entrar sin clave)\n- Launcher: ID de soporte con «enviar datos», ya no se instala el Mouse Tweaks real, arreglos de ventana de logs / overlay de inicio"
