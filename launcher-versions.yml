releasesRepo: "NUTCRACKER-com/checkup"
notes: "Neu im Launcher:\n• Mehrere Instanzen gleichzeitig starten – oben neben der Glocke siehst du alle laufenden Instanzen (Logs zeigen, Schließen, Beenden)\n• Eigenes Log-Fenster beim Spielstart (abschaltbar), Logs mit Suche, Filter und Kopieren\n• Windows-App pro Instanz: Modpack direkt über die Windows-Suche starten\n• Screenshot-Editor im Launcher\n• Neuigkeiten und Updates live, dazu Windows-Benachrichtigung (in den Einstellungen abschaltbar)\n• NUTclient-Ausgabe wählbar: Full, Mini oder Custom – jederzeit änderbar\n• Spanisch als neue Sprache\n• Offline-Konten gibt es nicht mehr, Anmeldung nur mit Microsoft\n• Whitelist- und Wartungsmodus: Zugang über unseren Discord\n• Fixes: Konto-Auswahl bleibt erhalten, RAM-Regler speichert, „Launcher schließen beim Start“ funktioniert\n\nNeu in der Mod:\n• Tooltips+ (Behälter-Vorschau, Haltbarkeit u. v. m.) und Streamer-Modus\n• Schrank und Shop mit Coins, Geschenke an Freunde, sofortige Synchronisierung\n• Gruppen-Emotes, Welt-Einladungen, Annehmen/Ablehnen direkt in der Benachrichtigung\n• Screenshot-Studio, Konto-Wechsel und Microsoft-Login im Spiel\n• Abzeichen: Admin (lila), Team (pink), NUT+ (gold), Creator (hellblau), Beta Tester (türkis)"

# Alle Versionen, neueste zuerst. Erscheinen im Launcher unter
# Einstellungen -> Version als auswählbare Liste (Downgrade/Pin auf eine
# bestimmte Version, nicht nur "immer neueste").
