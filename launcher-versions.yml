  - version: "0.5.9"
    date: "2026-10-10"
    notes: "Neu im Launcher:\n• Mehrere Instanzen gleichzeitig starten – oben neben der Glocke siehst du alle laufenden Instanzen (Logs zeigen, Schließen, Beenden)\n• Eigenes Log-Fenster beim Spielstart (abschaltbar), Logs mit Suche, Filter und Kopieren\n• Windows-App pro Instanz: Modpack direkt über die Windows-Suche starten\n• Screenshot-Editor im Launcher\n• Neuigkeiten und Updates live, dazu Windows-Benachrichtigung (in den Einstellungen abschaltbar)\n• NUTclient-Ausgabe wählbar: Full, Mini oder Custom – jederzeit änderbar\n• Spanisch als neue Sprache\n• Offline-Konten gibt es nicht mehr, Anmeldung nur mit Microsoft\n• Whitelist- und Wartungsmodus: Zugang über unseren Discord\n• Fixes: Konto-Auswahl bleibt erhalten, RAM-Regler speichert, „Launcher schließen beim Start“ funktioniert\n\nNeu in der Mod:\n• Tooltips+ (Behälter-Vorschau, Haltbarkeit u. v. m.) und Streamer-Modus\n• Schrank und Shop mit Coins, Geschenke an Freunde, sofortige Synchronisierung\n• Gruppen-Emotes, Welt-Einladungen, Annehmen/Ablehnen direkt in der Benachrichtigung\n• Screenshot-Studio, Konto-Wechsel und Microsoft-Login im Spiel\n• Abzeichen: Admin (lila), Team (pink), NUT+ (gold), Creator (hellblau), Beta Tester (türkis)"
    notesEn: "New in the launcher:\n• Run several instances at once – next to the bell you see all running instances (show logs, close, kill)\n• Separate log window on game start (can be turned off), logs with search, filter and copy\n• Windows app per instance: start a modpack straight from Windows search\n• Screenshot editor in the launcher\n• News and updates arrive live, plus a Windows notification (can be turned off in settings)\n• Choose your NUTclient edition: Full, Mini or Custom – change it any time\n• Spanish added as a language\n• Offline accounts are gone, sign in with Microsoft only\n• Whitelist and maintenance mode: get access through our Discord\n• Fixes: selected account is remembered, RAM slider saves, \"close launcher on start\" works\n\nNew in the mod:\n• Tooltips+ (container preview, durability and more) and Streamer mode\n• Locker and shop with coins, gifts for friends, instant sync\n• Group emotes, world invites, accept/decline right in the notification\n• Screenshot studio, account switching and Microsoft login in game\n• Badges: admin (purple), team (pink), NUT+ (gold), creator (light blue), beta tester (turquoise)Nouveautés du launcher :\n• Lance plusieurs instances en même temps – à côté de la cloche, tu vois toutes les instances en cours (afficher les logs, fermer, tuer)\n• Fenêtre de logs séparée au lancement (désactivable), logs avec recherche, filtre et copie\n• Application Windows par instance : lance un modpack directement depuis la recherche Windows\n• Éditeur de captures d'écran dans le launcher\n• Actualités et mises à jour en direct, avec notification Windows (désactivable dans les paramètres)\n• Choisis ton édition NUTclient : Full, Mini ou Custom – modifiable à tout moment\n• Espagnol ajouté comme langue\n• Les comptes hors ligne n'existent plus, connexion avec Microsoft uniquement\n• Mode whitelist et mode maintenance : accès via notre Discord\n• Corrections : le compte choisi est conservé, le curseur de RAM s'enregistre, « fermer le launcher au lancement » fonctionne\n\nNouveautés du mod :\n• Tooltips+ (aperçu des conteneurs, durabilité, etc.) et mode streamer\n• Casier et boutique avec des coins, cadeaux pour les amis, synchronisation instantanée\n• Emotes de groupe, invitations de monde, accepter/refuser directement dans la notification\n• Studio de captures, changement de compte et connexion Microsoft en jeu\n• Badges : admin (violet), équipe (rose), NUT+ (or), créateur (bleu clair), bêta-testeur (turquoise)"
    notesFr: "Nouveautés du launcher :\n• Lance plusieurs instances en même temps – à côté de la cloche, tu vois toutes les instances en cours (afficher les logs, fermer, tuer)\n• Fenêtre de logs séparée au lancement (désactivable), logs avec recherche, filtre et copie\n• Application Windows par instance : lance un modpack directement depuis la recherche Windows\n• Éditeur de captures d'écran dans le launcher\n• Actualités et mises à jour en direct, avec notification Windows (désactivable dans les paramètres)\n• Choisis ton édition NUTclient : Full, Mini ou Custom – modifiable à tout moment\n• Espagnol ajouté comme langue\n• Les comptes hors ligne n'existent plus, connexion avec Microsoft uniquement\n• Mode whitelist et mode maintenance : accès via notre Discord\n• Corrections : le compte choisi est conservé, le curseur de RAM s'enregistre, « fermer le launcher au lancement » fonctionne\n\nNouveautés du mod :\n• Tooltips+ (aperçu des conteneurs, durabilité, etc.) et mode streamer\n• Casier et boutique avec des coins, cadeaux pour les amis, synchronisation instantanée\n• Emotes de groupe, invitations de monde, accepter/refuser directement dans la notification\n• Studio de captures, changement de compte et connexion Microsoft en jeu\n• Badges : admin (violet), équipe (rose), NUT+ (or), créateur (bleu clair), bêta-testeur (turquoise)"
    notesEs: "Novedades del launcher:\n• Ejecuta varias instancias a la vez – junto a la campana ves todas las instancias abiertas (mostrar logs, cerrar, terminar)\n• Ventana de logs aparte al iniciar el juego (se puede desactivar), logs con búsqueda, filtro y copiar\n• App de Windows por instancia: inicia un modpack directamente desde la búsqueda de Windows\n• Editor de capturas de pantalla en el launcher\n• Novedades y actualizaciones en directo, con aviso de Windows (se puede desactivar en los ajustes)\n• Elige tu edición de NUTclient: Full, Mini o Custom – cámbiala cuando quieras\n• El español ya es un idioma disponible\n• Ya no hay cuentas sin conexión, solo inicio de sesión con Microsoft\n• Modo whitelist y modo mantenimiento: acceso a través de nuestro Discord\n• Correcciones: se recuerda la cuenta elegida, el control de RAM se guarda, «cerrar el launcher al iniciar» funciona\n\nNovedades del mod:\n• Tooltips+ (vista previa de contenedores, durabilidad y más) y modo streamer\n• Taquilla y tienda con monedas, regalos para amigos, sincronización instantánea\n• Emotes de grupo, invitaciones a mundos, aceptar/rechazar desde la notificación\n• Estudio de capturas, cambio de cuenta e inicio de sesión de Microsoft en el juego\n• Insignias: admin (morado), equipo (rosa), NUT+ (dorado), creador (azul claro), beta tester (turquesa)"
